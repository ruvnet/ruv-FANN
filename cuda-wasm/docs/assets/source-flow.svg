<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="268" viewBox="0 0 1000 268" role="img" aria-labelledby="title desc">
  <title id="title">CUDA source generation through the Node wrapper</title>
  <desc id="desc">CUDA source goes through bounded UTF-8 input in Node.js, then a trusted external cuda2rust process, then Rust or WGSL source text. Compiling, validating and executing the output are separate steps.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .flow { stroke-dasharray: 5 9; animation: travel 6s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -84; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="1000" height="268" rx="18" fill="#111c30"/>
  <text x="30" y="38" fill="#79dfd0" font-size="12" font-weight="700" letter-spacing="2">CUDA-WASM / NODE.JS 2.0</text>
  <text x="30" y="74" fill="#eef4ff" font-size="25" font-weight="650">Generate source. Validate it. Then compile.</text>
  <g fill="#1a2b43" stroke="#415875">
    <rect x="30" y="106" width="200" height="92" rx="10"/>
    <rect x="276" y="106" width="200" height="92" rx="10"/>
    <rect x="522" y="106" width="200" height="92" rx="10"/>
    <rect x="768" y="106" width="200" height="92" rx="10"/>
  </g>
  <g fill="#eef4ff" font-size="16" font-weight="600">
    <text x="47" y="137">CUDA C++ subset</text><text x="293" y="137">Node wrapper</text>
    <text x="539" y="137">cuda2rust ≥0.2.0</text><text x="785" y="137">Rust / WGSL text</text>
  </g>
  <g fill="#b8c8df" font-size="12">
    <text x="47" y="164">Source string or file</text><text x="47" y="183">1 MiB UTF-8 input limit</text>
    <text x="293" y="164">Private input + fixed argv</text><text x="293" y="183">No shell or install hooks</text>
    <text x="539" y="164">Trusted external executable</text><text x="539" y="183">Bounded time and output</text>
    <text x="785" y="164">Source code returned to you</text><text x="785" y="183">Separate compiler / validation</text>
  </g>
  <path class="flow" d="M230 152H276 M476 152H522 M722 152H768" fill="none" stroke="#79dfd0" stroke-width="2"/>
  <text x="30" y="239" fill="#b8c8df" font-size="13">This npm package does not compile or execute GPU kernels and does not produce a compiled WASM kernel.</text>
</svg>
