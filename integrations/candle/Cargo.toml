[package]
name = "ruv-fann-candle"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Optional CPU Candle linear-tensor import into owned ruv-FANN prepared inference"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv-FANN"
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace]

[dependencies]
candle-core = { version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
ruv-fann = { version = "=0.2.2", path = "../..", default-features = false, features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
