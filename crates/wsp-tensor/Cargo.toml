[package]
name = "ruv-fann-wsp-tensor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded, streaming Safetensors checkpoint edits for WSP experiments"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
half = "2"
tempfile = "3"

[dev-dependencies]
safetensors = "0.4.5"

