[package]
name = "opencv-sys"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = ["ruv-FANN Team <team@ruv-fann.org>"]
description = "Exception-safe C ABI bridge to system OpenCV 4"
license = "Apache-2.0"
repository = "https://github.com/ruvnet/ruv-FANN"
homepage = "https://github.com/ruvnet/ruv-FANN"
documentation = "https://docs.rs/opencv-sys"
keywords = ["opencv", "ffi", "bindings", "computer-vision"]
categories = ["external-ffi-bindings", "computer-vision"]
links = "ruv_opencv_bridge"
include = ["src/**", "tests/**", "build.rs", "Cargo.toml", "README.md", "LICENSE-APACHE"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"
pkg-config = "0.3"

[features]
default = []
cuda = []
contrib = []


[dev-dependencies]
tempfile = "3"
