[package]
name = "ruv-fann-rune-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Private executable verifying the actual ruv-FANN library through Rune"

[dependencies]
ruv-fann = { path = "core", version = "=0.2.3" }

[profile.release]
opt-level = 3
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true
