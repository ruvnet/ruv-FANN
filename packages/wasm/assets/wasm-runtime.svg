<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc"><title id="title">ruv-fann-wasm backend selection</title><desc id="desc">The loader chooses SIMD when supported or the portable core backend. Each backend has separate WebAssembly memory and bindings. Motion illustrates loading, not simultaneous execution.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b31"/><stop offset="1" stop-color="#08101e"/></linearGradient></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf7}.muted{fill:#9db0c9}.accent{fill:#5eead4}.line{fill:none;stroke:#25435a;stroke-width:2}.flow{fill:none;stroke:#5eead4;stroke-width:2;stroke-dasharray:6 22;animation:travel 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.delay{animation-delay:1s}.delay2{animation-delay:2s}
@keyframes travel{to{stroke-dashoffset:-112}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style><rect width="960" height="380" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="958" height="378" rx="19" fill="none" stroke="#24354c"/><text x="36" y="42" font-size="13" letter-spacing="3" class="accent">RUV-FANN-WASM / RUNTIME</text><text x="36" y="83" font-size="29" font-weight="700">One loader. Two isolated backends.</text><text x="36" y="110" font-size="15" class="muted">Bundled WebAssembly · automatic SIMD detection · zero npm dependencies</text>
<rect x="36" y="172" width="224" height="110" rx="14" fill="#122239" stroke="#37516d"/><text x="60" y="205" font-size="13" class="accent">JAVASCRIPT / TYPESCRIPT</text><text x="60" y="239" font-size="23" font-weight="700">loadWasm()</text><text x="60" y="264" font-size="14" class="muted">simd: 'auto'</text>
<path class="line" d="M260 227 H335 V184 H413 M335 227 V296 H413"/><path class="flow" d="M260 227 H335 V184 H413"/><path class="flow delay" d="M260 227 H335 V296 H413"/>
<rect x="414" y="145" width="240" height="79" rx="12" fill="#102b39" stroke="#5eead4"/><text x="438" y="176" font-size="20" font-weight="700">WASM SIMD</text><text x="438" y="203" font-size="14" class="muted">Selected when supported</text>
<rect x="414" y="257" width="240" height="79" rx="12" fill="#19243d" stroke="#a5b4fc"/><text x="438" y="288" font-size="20" font-weight="700">WASM core</text><text x="438" y="315" font-size="14" class="muted">Portable fallback</text>
<path class="flow" d="M654 184 H710"/><path class="flow delay" d="M654 296 H710"/>
<rect x="712" y="145" width="211" height="79" rx="12" fill="#102b39" stroke="#37516d"/><text x="736" y="176" font-size="17">SIMD memory</text><text x="736" y="203" font-size="14" class="muted">Own bindings + objects</text>
<rect x="712" y="257" width="211" height="79" rx="12" fill="#19243d" stroke="#37516d"/><text x="736" y="288" font-size="17">Core memory</text><text x="736" y="315" font-size="14" class="muted">Own bindings + objects</text>
<text x="36" y="350" font-size="13" class="muted">Node: bundled files on disk</text><text x="36" y="369" font-size="13" class="muted">Browser: assets on your server</text></svg>
