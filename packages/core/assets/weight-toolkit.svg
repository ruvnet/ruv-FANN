<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">ruv-fann: train, inspect, test and explicitly promote small neural networks</title>
  <desc id="desc">Four illustrated cards show a small neural network, a proposed weight edit, independent validation gates and an explicit promotion to revision two. Proposals do not change the active model. This illustration is conceptual; the README links to a real WASM demonstration.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#172c2b" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#2d7068" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172c2b}.serif{font-family:Georgia,'Times New Roman',serif}.muted{fill:#52645f}.label{font-size:15px;font-weight:700;letter-spacing:2px}.body{font-size:19px}.small{font-size:16px}.card{fill:#fffdf8;stroke:#d7ded5}.teal{fill:#2d7068}.orange{fill:#b7482b}.flow{fill:none;stroke:#2d7068;stroke-width:2;marker-end:url(#arrow)}.trace{fill:none;stroke:#b7482b;stroke-width:4;stroke-dasharray:14 70;animation:trace 3.8s ease-out 1 both}.pulse{fill:none;stroke:#b7482b;stroke-width:2;animation:pulse 3.8s ease-out 1 both}@keyframes trace{0%{stroke-dashoffset:170;opacity:0}15%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes pulse{0%,25%{opacity:0}40%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.trace,.pulse{animation:none;display:none}}
    </style>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#f6f4ee"/>
  <rect width="1200" height="560" rx="22" fill="url(#grid)"/>
  <path d="M44 38h36" stroke="#b7482b" stroke-width="4"/>
  <text x="94" y="44" class="label">RUV-FANN · JAVASCRIPT + RUST + WASM</text>
  <text x="44" y="111" font-size="49" class="serif">Small networks. Visible decisions.</text>
  <text x="44" y="147" font-size="20" class="muted">Train a model. Inspect its weights. Test a change. Choose what becomes active.</text>
  <g transform="translate(44 185)">
    <rect width="250" height="262" rx="15" class="card"/>
    <text x="20" y="34" class="label muted">01 / RUN + TRAIN</text>
    <g stroke="#9db6ab" stroke-width="2">
      <path d="M54 91 125 72 196 110M54 91 125 145 196 110M54 137 125 72M54 137 125 145" fill="none"/>
      <circle cx="54" cy="91" r="10" fill="#f6f4ee"/><circle cx="54" cy="137" r="10" fill="#f6f4ee"/>
      <circle cx="125" cy="72" r="12" fill="#dfece2"/><circle cx="125" cy="145" r="12" fill="#dfece2"/><circle cx="196" cy="110" r="14" fill="#2d7068" stroke="#2d7068"/>
    </g>
    <path d="M54 91 125 72 196 110" class="trace"/>
    <text x="20" y="205" class="body">Local neural inference</text>
    <text x="20" y="234" class="small muted">Batches · SGD · AdamW</text>
  </g>
  <path d="M304 310h25" class="flow"/>
  <g transform="translate(331 185)">
    <rect width="250" height="262" rx="15" class="card"/>
    <text x="20" y="34" class="label muted">02 / PROPOSE</text>
    <rect x="24" y="62" width="202" height="98" rx="10" fill="#f6f4ee"/>
    <text x="42" y="99" font-size="23" font-family="monospace">weight[0]</text>
    <text x="42" y="135" font-size="23" font-family="monospace">0 → <tspan class="orange" font-weight="700">1</tspan></text>
    <path d="m189 105 10-10 7 7-10 10-10 3z" fill="#b7482b"/>
    <text x="20" y="205" class="body">A bounded weight edit</text>
    <text x="20" y="234" class="small muted">Inspect · trace · search · ablate</text>
  </g>
  <path d="M591 310h25" class="flow"/>
  <g transform="translate(618 185)">
    <rect width="250" height="262" rx="15" class="card"/>
    <text x="20" y="34" class="label muted">03 / VALIDATE</text>
    <g fill="#e4ede3"><rect x="24" y="62" width="202" height="29" rx="6"/><rect x="24" y="99" width="202" height="29" rx="6"/><rect x="24" y="136" width="202" height="29" rx="6"/></g>
    <g fill="none" stroke="#2d7068" stroke-width="2.5"><path d="m36 75 5 5 9-10M36 112l5 5 9-10M36 149l5 5 9-10"/></g>
    <text x="61" y="82" class="small">Development data</text><text x="61" y="119" class="small">Independent holdout</text><text x="61" y="156" class="small">Finite-domain checks</text>
    <text x="20" y="205" class="body">Evidence before action</text>
    <text x="20" y="234" class="small muted">Failures preserve live weights</text>
  </g>
  <path d="M878 310h25" class="flow"/>
  <g transform="translate(905 185)">
    <rect width="250" height="262" rx="15" fill="#172c2b"/>
    <text x="20" y="34" class="label" style="fill:#e0eae1">04 / PROMOTE</text>
    <circle cx="125" cy="110" r="45" fill="#29413b" stroke="#7da28e"/>
    <circle cx="125" cy="110" r="54" class="pulse"/>
    <text x="125" y="122" text-anchor="middle" font-size="36" class="serif" style="fill:#fffdf8">v2</text>
    <text x="20" y="205" class="body" style="fill:#fffdf8">Explicit revision change</text>
    <text x="20" y="234" class="small" style="fill:#c3d1c8">History + explicit rollback</text>
  </g>
  <path d="M44 480h1111" stroke="#d7ded5"/>
  <circle cx="53" cy="514" r="5" fill="#b7482b"/>
  <text x="70" y="520" font-size="18">A proposal stays separate from the active model until you promote it.</text>
  <text x="1154" y="520" text-anchor="end" class="label teal">EXPLORE THE FIELD GUIDE ↗</text>
</svg>
