[package]
name = "ruv-fann-napi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Actual ruv-FANN prepared inference and reverse-mode training through Node-API 8"

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.16.1", default-features = false, features = ["napi8"] }
napi-derive = "=3.7.0"
ruv-fann = { version = "0.2.2", path = "../..", default-features = false, features = ["std", "serde"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[build-dependencies]
napi-build = "=2.6.0"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
overflow-checks = true
lto = "thin"
codegen-units = 1
