[package]
name = "ruv-fann-esp32-c5"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[features]
firmware = ["dep:esp-hal", "dep:esp-bootloader-esp-idf", "dep:esp-println"]

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "=1.1.2", features = ["esp32c5"], optional = true }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c5"], optional = true }
esp-println = { version = "=0.17.0", features = ["esp32c5"], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
ruv-fann = { path = "../..", default-features = false, features = ["serde"] }

[[bin]]
name = "ruvfann-c5"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
