# This is a configuration file for cargo-deny
# See https://embarkstudios.github.io/cargo-deny/

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]

[[licenses.clarify]]
crate = "adler2"
expression = "MIT OR Apache-2.0 OR 0BSD"
license-files = []

[[licenses.clarify]]
crate = "autocfg"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "bincode"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "cfg-if"
expression = "MIT OR Apache-2.0"
license-files = []

[advisories]
# Native SQLite and MCP use patched suppliers. The old sqlx/RSA and
# optional tch/Candle/zip graphs are absent from the committed lock; their
# obsolete vulnerability exceptions have been removed.
#
# Unmaintained, no advisory-listed replacement version:
# RUSTSEC-2025-0012 backoff / RUSTSEC-2024-0384 instant: ruv-swarm-transport
#   websocket reconnect; no vulnerability, only maintenance status.
# RUSTSEC-2024-0449 unsafe-libyaml: via serde_yaml (ruv-swarm-cli,
#   swe-bench-adapter config files); no vulnerability, only maintenance status.
# RUSTSEC-2025-0141 bincode 1.x / RUSTSEC-2024-0436 paste /
# RUSTSEC-2022-0054 wee_alloc: same rationale as the repo-root deny.toml.
ignore = [
    "RUSTSEC-2025-0012",  # backoff unmaintained
    "RUSTSEC-2024-0384",  # instant unmaintained (via backoff)
    "RUSTSEC-2024-0449",  # unsafe-libyaml unmaintained (via serde_yaml)
    "RUSTSEC-2025-0141",  # bincode 1.x unmaintained
    "RUSTSEC-2024-0436",  # paste unmaintained
    "RUSTSEC-2022-0054",  # wee_alloc unmaintained
]

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com"]
