[package]
# Publish source and required assets, excluding session state and runtime databases.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
]
name = "ruv-swarm-mcp"
version = "1.0.7"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://ruv.io"
rust-version = "1.89"  # Patched native SQLite persistence requires 1.89; rmcp itself needs 1.88.
description = "Model Context Protocol (MCP) integration for RUV Swarm"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "swarm", "agents", "json-rpc"]
categories = ["development-tools", "network-programming"]

[[bin]]
name = "ruv-swarm-mcp"
path = "src/main.rs"

[[bin]]
name = "ruv-swarm-mcp-stdio"
path = "src/bin/stdio.rs"

[dependencies]
# Core workspace dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }

# MCP SDK for stdio transport
# RUSTSEC-2026-0462: pin the SDK release with bounded HTTP response buffering.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }

# MCP specific dependencies (WebSocket)
axum = { version = "0.7", features = ["ws", "json"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# WebSocket support
tokio-tungstenite = "0.27.0"
tungstenite = "0.27.0"

# JSON Schema
schemars = { version = "0.8", features = ["derive"] }
jsonschema = { version = "0.30.0", default-features = false, features = ["resolve-file"] }

# Security utilities
rand = "0.8"

# UUID for session management
uuid = { version = "1.11.2", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4.39", features = ["serde"] }

# Error handling and logging for stdio binary
color-eyre = "0.6.3"

# Internal dependencies
ruv-swarm-core = { path = "../ruv-swarm-core", version = "1.0.7" }
ruv-swarm-persistence = { path = "../ruv-swarm-persistence", version = "1.0.8" }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = "0.4"
