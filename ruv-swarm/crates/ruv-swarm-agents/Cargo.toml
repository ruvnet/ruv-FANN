[package]
# Publish source and required assets, excluding session state and runtime databases.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
]
name = "ruv-swarm-agents"
version = "1.0.6"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Specialized AI agents for RUV Swarm"

[dependencies]
ruv-swarm-core = { path = "../ruv-swarm-core", version = "1.0.7" }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
