[package]
# Publish source and required assets, excluding session state and runtime databases.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE*",
]
name = "ruv-swarm-wasm-unified"
version = "2.0.1"
rust-version.workspace = true
edition = "2021"
authors = ["The ruv-swarm Contributors"]
description = "WebAssembly facade for the validated ruv-swarm browser bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv-FANN"
keywords = ["wasm", "neural-network", "swarm", "ruv-fann", "forecasting"]
categories = ["wasm", "science", "algorithms", "mathematics", "concurrency"]

readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
ruv-swarm-wasm = { path = "../ruv-swarm-wasm", version = "1.0.6", default-features = false }

[features]
default = ["simd"]
simd = ["ruv-swarm-wasm/simd"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
