[package]
name = "neuro-divergent"
version = "0.2.1"
edition = "2021"
authors = ["Claude Code <noreply@anthropic.com>"]
description = "Experimental neural forecasting library inspired by NeuralForecast and built on ruv-FANN"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/ruv-FANN"
homepage = "https://github.com/ruvnet/ruv-FANN"
documentation = "https://docs.rs/neuro-divergent"
keywords = ["neural-network", "forecasting", "time-series", "machine-learning", "rust"]
categories = ["science", "algorithms", "mathematics"]
readme = "README.md"

[workspace]
members = [
    ".",
    "neuro-divergent-core",
    "neuro-divergent-data",
    "neuro-divergent-models",
    "neuro-divergent-registry", 
    "neuro-divergent-training"
]

[lib]
name = "neuro_divergent"
path = "src/lib.rs"

[dependencies]
# Core numeric traits and operations
num-traits = "0.2"
num-complex = "0.4"

# Data structures and manipulation
polars = { version = "0.45.1", features = ["lazy", "temporal", "csv", "parquet", "json"] }
ndarray = "0.15"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"

# Parallel processing
rayon = "1.8"

# Async support
tokio = { version = "1.0", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

# Optional GPU support

# Logging and monitoring
log = "0.4"
tracing = { version = "0.1", optional = true }

# Keep workspace builds and release dependency versions aligned.
neuro-divergent-core = { version = "0.2.0", path = "neuro-divergent-core" }
neuro-divergent-models = { version = "0.2.0", path = "neuro-divergent-models", optional = true }
neuro-divergent-registry = { version = "0.2.0", path = "neuro-divergent-registry", optional = true }

# ruv-FANN dependency
ruv-fann = { version = "0.2.3", path = ".." }

[dev-dependencies]
neuro-divergent-data = { version = "0.2.0", path = "neuro-divergent-data" }
neuro-divergent-training = { version = "0.2.0", path = "neuro-divergent-training" }
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[features]
default = ["std", "models", "registry"]
std = []
async = ["tokio", "futures"]
gpu = []  # Reserved: no GPU execution path is implemented in these crates.
tracing = ["dep:tracing"]
models = ["dep:neuro-divergent-models"]
registry = ["dep:neuro-divergent-registry"]
python-compat = []  # Enable Python-specific compatibility features

# Compatibility markers only; these crates still require std and do not
# provide a separately validated browser or freestanding forecasting build.
wasm = []
no_std = []


[[test]]
name = "memory_tests"
path = "tests/performance/memory_tests.rs"

[[test]]
name = "scaling_tests"
path = "tests/performance/scaling_tests.rs"

[[example]]
name = "complete_workflow"
path = "examples/complete_workflow.rs"

[[example]]
name = "ensemble_forecasting"
path = "examples/ensemble_forecasting.rs"

[[example]]
name = "advanced_features"
path = "examples/advanced_features.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "comparison_benchmarks"
harness = false


[[bench]]
name = "data_processing_benchmarks"
harness = false


[[bench]]
name = "inference_benchmarks"
harness = false


[[bench]]
name = "model_benchmarks"
harness = false


[[bench]]
name = "training_benchmarks"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"
