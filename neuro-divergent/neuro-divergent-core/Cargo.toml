[package]
name = "neuro-divergent-core"
version = "0.2.0"
edition = "2021"
authors = ["Claude Code <noreply@anthropic.com>"]
license = "MIT OR Apache-2.0"
description = "Core foundation for neuro-divergent neural forecasting library"
repository = "https://github.com/ruvnet/ruv-FANN"
homepage = "https://github.com/ruvnet/ruv-FANN"
documentation = "https://docs.rs/neuro-divergent-core"
keywords = ["neural-network", "forecasting", "time-series", "machine-learning", "rust"]
categories = ["science", "algorithms", "mathematics"]

[dependencies]
# Core numeric types and traits
num-traits = "0.2"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Data structures and processing
ndarray = "0.15"
polars = { version = "0.45.1", features = ["lazy", "temporal", "csv", "parquet", "json"] }

# Parallel processing
rayon = "1.8"

# Random number generation
rand = "0.8"

# ruv-FANN integration
ruv-fann = { version = "0.2.2", path = "../.." }

# Optional GPU acceleration

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
approx = "0.5"

[features]
default = ["std"]
std = []
gpu = []  # Reserved: no GPU execution path is implemented in these crates.
all = ["std", "gpu"]

[lib]
name = "neuro_divergent_core"
path = "src/lib.rs"
doctest = true


[target.'cfg(unix)'.dependencies]
libc = "0.2"
