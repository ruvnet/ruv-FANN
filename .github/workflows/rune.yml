name: Rune frozen core evidence

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.rs'
      - 'src/**'
      - 'README.md'
      - 'LICENSE*'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'config/rune.json'
      - 'config/rune-probe/**'
      - 'scripts/rune*.py'
      - 'scripts/tests/test_rune*.py'
      - 'docs/rune*'
      - '.github/workflows/rune.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.rs'
      - 'src/**'
      - 'README.md'
      - 'LICENSE*'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'config/rune.json'
      - 'config/rune-probe/**'
      - 'scripts/rune*.py'
      - 'scripts/tests/test_rune*.py'
      - 'docs/rune*'
      - '.github/workflows/rune.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: rune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_TOOLCHAIN: 1.88.0
  RUNE_REVISION: 92425512f0f742e21b747f58f7555104446fc9de
  RUNE_LOCK_SHA256: 6509be23921039376d94f688822cd624167f42a5886b2f067c89ad97a6ecde28

jobs:
  verify:
    name: Pinned Rune / actual core probe and correctness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.88.0
      - name: Install pinned workflow-test dependency (explicit setup)
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps
          --only-binary=:all: -r .github/tests/requirements-rune.txt
      - name: Check workflow failure gates and adapter boundaries
        run: |
          python3 -m unittest discover -s .github/tests -p 'test_rune*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_rune*.py' -v
      - name: Record the adapter plan without executing it
        id: plan
        run: python3 scripts/rune.py plan --repo . > "$RUNNER_TEMP/rune-plan.json"
      - name: Fetch and check the exact Rune source (explicit setup)
        id: source
        run: |
          set -euo pipefail
          rune_source="$RUNNER_TEMP/rune-source"
          git init "$rune_source"
          git -C "$rune_source" remote add origin https://github.com/ruvnet/rune.git
          git -C "$rune_source" fetch --depth 1 origin "$RUNE_REVISION"
          git -C "$rune_source" checkout --detach FETCH_HEAD
          test "$(git -C "$rune_source" rev-parse HEAD)" = "$RUNE_REVISION"
          printf '%s  %s\n' "$RUNE_LOCK_SHA256" "$rune_source/Cargo.lock" | sha256sum --check
          git -C "$rune_source" diff --exit-code
      - name: Prepare actual core probe source without building
        id: prepare
        run: python3 scripts/rune.py prepare --repo . --output "$RUNNER_TEMP/rune-prefetch"
      - name: Prefetch the three committed Cargo graphs (explicit network setup)
        id: prefetch
        env:
          CARGO_HOME: ${{ runner.temp }}/rune-dependencies
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/rune-source/Cargo.toml"
          cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/rune-prefetch/workspace/Cargo.toml"
      - name: Build and attest Rune from the pinned source offline
        id: setup
        env:
          CARGO_HOME: ${{ runner.temp }}/rune-dependencies
          CARGO_NET_OFFLINE: 'true'
        run: >-
          python3 scripts/rune.py setup --source "$RUNNER_TEMP/rune-source"
          --prefix "$RUNNER_TEMP/rune-tool" --timeout 1200
      - name: Verify frozen replay, clean rebuild, core correctness and rejection checks
        id: verify
        env:
          CARGO_HOME: ${{ runner.temp }}/rune-dependencies
          CARGO_NET_OFFLINE: 'true'
        # Cargo offline governs dependency resolution; build scripts remain host
        # code. This gate performs no model calls, edits, promotion or publishing.
        run: >-
          python3 scripts/rune.py verify --repo .
          --tool-receipt "$RUNNER_TEMP/rune-tool/tool-receipt.json"
          --output "$RUNNER_TEMP/rune-evidence" --timeout 1200
      - name: Require complete acceptance evidence
        id: evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          receipt = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rune-evidence/receipt.json').read_text())
          require(receipt.get('status') == 'passed', 'Rune verification did not pass')
          require(receipt.get('upstream', {}).get('commit') == os.environ['RUNE_REVISION'], 'Wrong Rune source revision')
          require(receipt.get('fresh_verify') is True and receipt.get('unchanged_core_lock') is True, 'Fresh reproduction or lock evidence missing')
          require(receipt.get('offline') is True and type(receipt.get('model_calls')) is int and receipt['model_calls'] == 0, 'Offline/model-free evidence missing')
          artifact = receipt.get('product', {})
          require(artifact.get('name') == 'ruv-fann-rune-probe' and artifact.get('stored_object_verified') is True, 'Wrong or unverified executable')
          require(isinstance(artifact.get('sha256'), str) and re.fullmatch('[a-f0-9]{64}', artifact['sha256']), 'Product digest missing')
          rune = receipt.get('rune_receipt', {})
          require(rune.get('artifact_digest') == artifact['sha256'] and rune.get('offline') is True and type(rune.get('model_calls')) is int and rune['model_calls'] == 0, 'Rune artifact receipt missing')
          for name in ('stale_source', 'plan_tamper', 'object_tamper'):
              value = receipt.get('negative_checks', {}).get(name)
              require(isinstance(value, dict) and value.get('status') == 'passed', name)
          for name in ('correctness', 'runtime_probe'):
              require(receipt.get(name, {}).get('status') == 'passed', name)
          commands = receipt.get('commands', [])
          required = {'freeze', 'replay', 'fresh-verify', 'explain', 'runtime-probe', 'release-source-correctness', 'reject-stale-source', 'reject-plan-tamper'}
          require(required <= {item.get('label') for item in commands} and all(item.get('status') == 'passed' for item in commands), 'Command evidence incomplete')
          require({'core/src/lib.rs', 'src/main.rs'} <= {item.get('path') for item in receipt.get('source', {}).get('files', [])}, 'Actual core/probe source evidence missing')
          print('Rune frozen replay, reproduction, runtime correctness and rejection evidence passed')
          PY
      - name: Require the source checkout to remain unchanged
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload Rune evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rune-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/rune-plan.json
            ${{ runner.temp }}/rune-tool/tool-receipt.json
            ${{ runner.temp }}/rune-tool/logs/**
            ${{ runner.temp }}/rune-prefetch/receipt.json
            ${{ runner.temp }}/rune-evidence/receipt.json
            ${{ runner.temp }}/rune-evidence/logs/**
