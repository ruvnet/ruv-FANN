name: Tensor WSP checkpoint validation
on:
  pull_request:
    paths: ['crates/wsp-tensor/**', 'scripts/tensor-release.py', 'scripts/tests/test_tensor_release.py', '.github/workflows/tensor-wsp.yml', '.github/workflows/protected-tensor-release.yml']
  push:
    branches: [main, 'release/**']
    paths: ['crates/wsp-tensor/**', 'scripts/tensor-release.py', 'scripts/tests/test_tensor_release.py', '.github/workflows/tensor-wsp.yml', '.github/workflows/protected-tensor-release.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tensor-wsp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - name: Install pinned MSRV and advisory tool
        run: |
          rustup toolchain install 1.81.0 --profile minimal
          cargo install cargo-audit --version '=0.22.2' --locked
      - name: Exercise release rejection guards
        run: python3 -m unittest discover -s scripts/tests -p 'test_tensor_release.py' -v
      - name: Seal source-bound archive after native, packed and independent CLI qualification
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/tensor-release.py seal --expected-sha "$EXPECTED_SHA" --directory "$RUNNER_TEMP/tensor-seal"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tensor-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tensor-seal/*.crate
            ${{ runner.temp }}/tensor-seal/*.json
            ${{ runner.temp }}/tensor-seal/*.log
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failing qualification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tensor-failure-${{ github.sha }}
          path: ${{ runner.temp }}/tensor-seal/*.log
          if-no-files-found: ignore
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/wsp-tensor
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - run: cargo test --locked --test checkpoints -- --test-threads=1
      - run: cargo build --release --locked
      - run: python3 scripts/e2e.py
