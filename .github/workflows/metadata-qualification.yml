name: metadata-qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: ['release/**']
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed source commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: metadata-qualification-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Require exact requested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          CALLER_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if test -n "$CALLER_SHA"; then test "$CALLER_SHA" = "$EXPECTED_SHA"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked consumer tooling without release credentials
        run: node scripts/metadata-release.mjs bootstrap
      - name: Require metadata release guard and mutation tests
        run: node --test scripts/metadata-release.test.mjs
      - name: Create canonical metadata archives once from public baselines and tracked overlays
        run: node scripts/metadata-release.mjs pack --directory "$RUNNER_TEMP/metadata-candidate"
      - name: Qualify exact installed archives on Node 22 and seal public dependency resolution
        run: node scripts/metadata-release.mjs qualify --directory "$RUNNER_TEMP/metadata-candidate"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Qualify the same archives and dependency resolution on Node 24
        run: node scripts/metadata-release.mjs qualify --directory "$RUNNER_TEMP/metadata-candidate"
      - name: Seal exact source, archives, baselines, dependency lock and both installed consumers
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: |
          node scripts/metadata-release.mjs seal --expected-sha "$EXPECTED_SHA" --directory "$RUNNER_TEMP/metadata-candidate"
          node scripts/metadata-release.mjs verify --directory "$RUNNER_TEMP/metadata-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-candidate-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          path: ${{ runner.temp }}/metadata-candidate/
          if-no-files-found: error
          retention-days: 90
