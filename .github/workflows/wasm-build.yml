name: WASM Target Checks

on:
  push:
    branches: [main, develop]
    paths: ['src/**', 'Cargo.*', 'ruv-swarm/**', '.github/workflows/wasm-build.yml']
  pull_request:
    branches: [main, develop]
    paths: ['src/**', 'Cargo.*', 'ruv-swarm/**', '.github/workflows/wasm-build.yml']
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: wasm32 / ${{ matrix.package }} / ${{ matrix.features || 'minimal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ruv-fann
            manifest: Cargo.toml
            features: wasm
          - package: ruv-fann
            manifest: Cargo.toml
            features: webgpu
          - package: ruv-fann
            manifest: Cargo.toml
            features: wasm-gpu
          - package: ruv-swarm-wasm
            manifest: ruv-swarm/Cargo.toml
            features: ''
          - package: ruv-swarm-wasm
            manifest: ruv-swarm/Cargo.toml
            features: full
          - package: ruv-swarm-wasm-unified
            manifest: ruv-swarm/Cargo.toml
            features: ''
          - package: ruv-swarm-wasm-unified
            manifest: ruv-swarm/Cargo.toml
            features: simd
          - package: ruv-swarm-core
            manifest: ruv-swarm/Cargo.toml
            features: wasm
          - package: ruv-swarm-daa
            manifest: ruv-swarm/Cargo.toml
            features: wasm
          - package: ruv-swarm-persistence
            manifest: ruv-swarm/Cargo.toml
            features: wasm
          - package: ruv-swarm-transport
            manifest: ruv-swarm/Cargo.toml
            features: wasm
          - package: cuda-rust-wasm
            manifest: cuda-wasm/Cargo.toml
            features: serde
          - package: opencv-wasm
            manifest: opencv-rust/Cargo.toml
            features: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Compile the selected package without substituting another crate
        env:
          CHECK_MANIFEST: ${{ matrix.manifest }}
          CHECK_PACKAGE: ${{ matrix.package }}
          CHECK_FEATURES: ${{ matrix.features }}
        run: >-
          cargo check --locked --manifest-path "$CHECK_MANIFEST" -p "$CHECK_PACKAGE"
          --lib --target wasm32-unknown-unknown --no-default-features
          --features "$CHECK_FEATURES"
