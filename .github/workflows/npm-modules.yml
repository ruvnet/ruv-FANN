name: npm modules

# Frozen publication contract for the ruv-fann-wasm/ruv-fann 0.1.2 pair.
# Invoke manually/reusably at a legacy source ref only. Current core and
# satellite qualification lives in wsp-toolkit.yml and is called by CI.
on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Node 22/24, browser, mutations and sealed consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the frozen legacy package generation
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const core=JSON.parse(readFileSync('packages/core/package.json','utf8'));
          const wasm=JSON.parse(readFileSync('packages/wasm/package.json','utf8'));
          if(core.version!=='0.1.2'||wasm.version!=='0.1.2'||core.dependencies?.['ruv-fann-wasm']!=='0.1.2')
            throw Error('This manual legacy lane qualifies only the frozen core/WASM 0.1.2 pair; use wsp-toolkit.yml for core 0.2.0 and its satellites.');
          JS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Real WASM tests on Node 22
        run: |
          node scripts/npm-modules-build.mjs
          mkdir -p packages/core/node_modules
          ln -s ../../wasm packages/core/node_modules/ruv-fann-wasm
          node --test --test-concurrency=1 packages/wasm/test/*.test.mjs packages/core/test/*.test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Real WASM tests and mutation checks on Node 24
        run: |
          node --test --test-concurrency=1 packages/wasm/test/*.test.mjs packages/core/test/*.test.mjs
          node scripts/npm-modules-mutation-test.mjs
      - name: Pack once and validate strict consumer types
        run: |
          npm install --prefix "$RUNNER_TEMP/ruv-fann-tools" --no-save --ignore-scripts typescript@5.9.3 playwright@1.55.1
          RUV_FANN_TSC="$RUNNER_TEMP/ruv-fann-tools/node_modules/typescript/bin/tsc" node scripts/npm-modules-pack-test.mjs "$RUNNER_TEMP/npm-release-candidate"
          node scripts/npm-release-lane.mjs pack --output "$RUNNER_TEMP/npm-release-candidate" --tarballs "$RUNNER_TEMP/npm-release-candidate"
      - name: Real Chromium inference and training
        env:
          RUV_FANN_PLAYWRIGHT: ${{ runner.temp }}/ruv-fann-tools/node_modules/playwright
        run: |
          "$RUNNER_TEMP/ruv-fann-tools/node_modules/.bin/playwright" install --with-deps chromium
          node scripts/npm-modules-browser-test.mjs
      - name: Exact packed consumer on Node 24
        run: node scripts/npm-release-lane.mjs consumer --manifest "$RUNNER_TEMP/npm-release-candidate/package-manifest.json" --output "$RUNNER_TEMP/npm-consumers/node-24.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Exact packed consumer on Node 22
        run: node scripts/npm-release-lane.mjs consumer --manifest "$RUNNER_TEMP/npm-release-candidate/package-manifest.json" --output "$RUNNER_TEMP/npm-consumers/node-22.json"
      - name: Seal the archives tested on both Node versions
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || 'ruv-fann-npm-v0.1.2' }}
        run: |
          node scripts/npm-release-lane.mjs seal --expected-sha "$EXPECTED_SHA" --release-tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/npm-release-candidate" --consumer-receipts "$RUNNER_TEMP/npm-consumers"
          cp "$RUNNER_TEMP/npm-consumers/"*.json "$RUNNER_TEMP/npm-release-candidate/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-module-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/npm-release-candidate/
