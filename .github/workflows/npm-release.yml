name: npm Release

on:
  pull_request:
    branches: [main]
    paths: ['ruv-swarm/npm/**', '.github/workflows/npm-release.yml']
  push:
    branches: [main]
    paths: ['ruv-swarm/npm/**', '.github/workflows/npm-release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed ruv-swarm version to publish
        required: true
        type: string

permissions:
  contents: read

# Neither this workflow nor the WASM checks creates a version automatically.
# A manual release must pass the complete repository gate and package checks.
jobs:
  acceptance:
    uses: ./.github/workflows/ci.yml

  test:
    name: npm package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: ruv-swarm/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --dry-run
      - name: Check one-shot commands exit
        timeout-minutes: 2
        run: |
          node bin/ruv-swarm-secure.js --version
          node bin/ruv-swarm-secure.js --help
          node bin/ruv-swarm-secure.js status

  publish:
    needs: [acceptance, test]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruv-swarm/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the reviewed manifest version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: >-
          node --input-type=module -e
          'import fs from "node:fs";
          const actual = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          if (actual !== process.env.EXPECTED_VERSION) {
          console.error("Requested version does not match package.json"); process.exit(1); }'
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
