name: NPM Release Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'ruv-swarm/npm/**'
      - '.github/workflows/npm-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ruv-swarm/npm/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.6)'
        required: true
        type: string

jobs:
  test:
    name: Test NPM Package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        
    - name: Setup Python with distutils (macOS)
      if: runner.os == 'macOS'
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
    
    - name: Install dependencies
      working-directory: ./ruv-swarm/npm
      run: npm ci
    
    - name: Run tests
      timeout-minutes: 15
      working-directory: ./ruv-swarm/npm
      run: npm test
    
    - name: Test NPX commands
      # `ruv-swarm --version` used to print and then never exit (open SQLite
      # handles), holding macOS runners for hours. Bound it.
      timeout-minutes: 5
      working-directory: ./ruv-swarm/npm
      run: |
        npm link
        npx ruv-swarm --version
        npx ruv-swarm --help

  validate-wasm:
    name: Validate WASM Loading
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      working-directory: ./ruv-swarm/npm
      run: npm ci

    - name: Test WASM loading
      timeout-minutes: 5
      working-directory: ./ruv-swarm/npm
      run: |
        node test-wasm-loading.js
        npm run test:wasm || true

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, validate-wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # Secrets cannot be referenced in step `if:` directly; expose via env.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Decide whether to publish
      id: gate
      timeout-minutes: 2
      working-directory: ./ruv-swarm/npm
      run: |
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ -z "$NPM_TOKEN" ]; then
          echo "::notice::NPM_TOKEN secret is not configured; skipping publish of ruv-swarm@$VERSION (publish manually)."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        elif [ -n "$(timeout 60 npm view "ruv-swarm@$VERSION" version 2>/dev/null)" ]; then
          echo "::notice::ruv-swarm@$VERSION is already on the registry; nothing to publish."
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      if: steps.gate.outputs.publish == 'true'
      timeout-minutes: 10
      working-directory: ./ruv-swarm/npm
      run: npm ci

    - name: Publish to NPM
      if: steps.gate.outputs.publish == 'true'
      timeout-minutes: 5
      working-directory: ./ruv-swarm/npm
      run: |
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
