name: Patched SQLite and MCP security

on:
  push:
    branches: [main, develop]
    paths: ['ruv-swarm/**', '**/Cargo.lock', '**/Cargo.toml', 'package*.json', 'scripts/verify-packages.py', '.github/workflows/sqlite-security.yml', '.github/workflows/ci.yml', '.github/tests/**']
  pull_request:
    branches: [main, develop]
    paths: ['ruv-swarm/**', '**/Cargo.lock', '**/Cargo.toml', 'package*.json', 'scripts/verify-packages.py', '.github/workflows/sqlite-security.yml', '.github/workflows/ci.yml', '.github/tests/**']
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: sqlite-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  rust:
    name: Patched native persistence, benchmark storage and real MCP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.89.0'
      - name: Initialize external Rust evidence and build directories
        id: environment
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sqlite-security-rust"
          printf 'CARGO_TARGET_DIR=%s/sqlite-security-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install the pinned workflow parser and check contracts
        id: contracts
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r .github/tests/requirements-rune.txt
          python3 -m unittest discover -s .github/tests -p 'test_sqlite_security*.py' -v
      - name: Fetch the committed native workspace graph explicitly
        id: fetch
        run: cargo +1.89.0 fetch --locked --manifest-path ruv-swarm/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/fetch.log"
      - name: Test the owned pool and discarded transaction rollback
        id: pool
        run: >-
          cargo +1.89.0 test --locked --offline --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-persistence --lib sqlite_pool::tests -- --nocapture
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/pool.log"
      - name: Require the actual patched C supplier and durable WAL database
        id: persistence
        run: >-
          cargo +1.89.0 test --locked --offline --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-persistence --test sqlite_release_gate -- --nocapture
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/persistence.log"
      - name: Test benchmark storage migration, atomicity and cancellation
        id: benchmark
        run: >-
          cargo +1.89.0 test --locked --offline --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-benchmarking --lib storage::tests -- --nocapture
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/benchmark.log"
      - name: Test actual SDK framing limits, UTF8 and stream recovery
        id: codec
        run: >-
          cargo +1.89.0 test --locked --offline --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-mcp --lib tests::stdio_transport -- --nocapture
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/codec.log"
      - name: Build the actual stdio server offline
        id: build
        run: >-
          cargo +1.89.0 build --locked --offline --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-mcp --bin ruv-swarm-mcp-stdio
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-rust/build.log"
      - name: Exercise the compiled server with bounded private database state
        id: protocol
        run: >-
          python3 ruv-swarm/crates/ruv-swarm-mcp/test_stdio.py --binary "$CARGO_TARGET_DIR/debug/ruv-swarm-mcp-stdio"
          > "$RUNNER_TEMP/sqlite-security-rust/stdio.json" 2> "$RUNNER_TEMP/sqlite-security-rust/stdio.log"
      - name: Require actual supplier, test execution and protocol evidence
        id: evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sqlite-security-rust'
          source = json.loads(Path('ruv-swarm/npm/scripts/sqlite-source.json').read_text())
          counts = {}
          for name in ('pool', 'persistence', 'benchmark', 'codec'):
              text = (root / (name + '.log')).read_text()
              matches = re.findall(r'test result: ok\. (\d+) passed; 0 failed;', text)
              if not matches or sum(map(int, matches)) == 0:
                  raise RuntimeError('Missing actual passing Rust tests: ' + name)
              counts[name] = sum(map(int, matches))
          text = (root / 'persistence.log').read_text()
          match = re.search(r'SQLite runtime: version=([^,\n]+), version_number=(\d+), source_id=([^\n]+)', text)
          if not match or int(match[2]) < 3_054_000 or match[1] != source['version'] or match[3].strip() != source['sourceId']:
              raise RuntimeError('Actual SQLite runtime does not match patched source')
          protocol = json.loads((root / 'stdio.json').read_text())
          required = {'initialize_and_legacy_negotiation', 'real_tool_catalogue_and_schemas', 'real_memory_round_trip', 'real_agent_spawn_and_persistence', 'invalid_arguments_return_tool_error', 'oversized_line_not_dispatched_and_stream_recovers', 'graceful_eof_shutdown'}
          if protocol['status'] != 'passed' or protocol['sdk'] != 'rmcp 3.9.0' or protocol['stdioLineLimit'] != 1048576 or not required.issubset(protocol['checks']):
              raise RuntimeError('Missing real bounded MCP proof')
          binary = Path(os.environ['CARGO_TARGET_DIR']) / 'debug/ruv-swarm-mcp-stdio'
          with binary.open('rb') as handle:
              digest = hashlib.file_digest(handle, 'sha256').hexdigest()
          if protocol['binarySha256'] != digest:
              raise RuntimeError('MCP executable identity changed')
          result = {'schema':'ruv-fann.sqlite-security-rust/1', 'status':'passed', 'testCounts':counts, 'sqliteVersion':match[1], 'sqliteSourceId':match[3].strip(), 'protocol':protocol}
          (root / 'receipt.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Require an unchanged source checkout
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload Rust evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-security-rust
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/sqlite-security-rust/

  advisories:
    name: Seven Cargo lock audits without advisory exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - name: Initialize external advisory evidence
        run: mkdir -m 700 "$RUNNER_TEMP/sqlite-security-audit"
      - name: Install the pinned audit tool explicitly
        id: setup
        run: cargo +1.99.1 install cargo-audit --version 0.22.2 --locked 2>&1 | tee "$RUNNER_TEMP/sqlite-security-audit/setup.log"
      - name: Audit every committed workspace lock
        id: audit
        run: python3 scripts/verify-packages.py --audit --report "$RUNNER_TEMP/sqlite-security-audit/audit.json" 2>&1 | tee "$RUNNER_TEMP/sqlite-security-audit/audit.log"
      - name: Audit the independent Candle and Node addon graphs
        id: extra-audits
        run: |
          cargo audit --file integrations/candle/Cargo.lock --deny unsound --json > "$RUNNER_TEMP/sqlite-security-audit/candle.json" 2> "$RUNNER_TEMP/sqlite-security-audit/candle.log"
          cargo audit --file bindings/napi/Cargo.lock --deny unsound --json > "$RUNNER_TEMP/sqlite-security-audit/napi.json" 2> "$RUNNER_TEMP/sqlite-security-audit/napi.log"
      - name: Require all seven successful audit results
        id: evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          records = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sqlite-security-audit/audit.json').read_text())
          expected = {'.', 'ruv-swarm', 'neuro-divergent', 'cuda-wasm', 'opencv-rust'}
          if len(records) != 5 or {item['workspace'] for item in records} != expected:
              raise RuntimeError('Missing workspace audit')
          for item in records:
              if item['exit_code'] != 0 or item['command'] != ['cargo', 'audit', '--file', 'Cargo.lock', '--deny', 'unsound']:
                  raise RuntimeError('Failed or weakened advisory audit')
          for name in ('candle', 'napi'):
              report = json.loads((Path(os.environ['RUNNER_TEMP']) / ('sqlite-security-audit/' + name + '.json')).read_text())
              found = report['vulnerabilities']
              settings = report['settings']
              if found['found'] is not False or found['count'] != 0 or found['list'] or settings['ignore'] != [] or settings['severity'] is not None or settings['target_arch'] != [] or settings['target_os'] != []:
                  raise RuntimeError('Vulnerability or advisory exception in ' + name)
          PY
      - name: Require an unchanged source checkout
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload audit evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-security-advisories
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/sqlite-security-audit/

  node:
    name: Patched SQLite runtime and package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Initialize external Node evidence
        run: mkdir -m 700 "$RUNNER_TEMP/sqlite-security-node"
      - name: Install the committed package graph without dependency scripts
        id: install
        run: npm ci --ignore-scripts --prefix ruv-swarm/npm 2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/install.log"
      - name: Build against the exact verified patched SQLite source
        id: build
        run: node ruv-swarm/npm/scripts/sqlite-build.mjs 2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/build.log"
      - name: Verify actual in-memory runtime, source identity and per-ABI binary
        id: verify
        run: node ruv-swarm/npm/scripts/sqlite-build.mjs --verify > "$RUNNER_TEMP/sqlite-security-node/runtime.json" 2> "$RUNNER_TEMP/sqlite-security-node/verify.log"
      - name: Test gateway rejection, persistence and build tampering
        id: focused
        run: node --test --test-reporter=tap ruv-swarm/npm/test/sqlite-engine.test.js 2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/focused.log"
      - name: Run the complete Node security regression suite
        id: security
        run: NODE_OPTIONS=--test-reporter=tap npm run test:security --prefix ruv-swarm/npm 2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/security.log"
      - name: Install an extracted package and exercise public CLI persistence
        id: package
        run: >-
          node ruv-swarm/npm/test/check-sqlite-package.mjs --output "$RUNNER_TEMP/sqlite-security-node/package"
          2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/package.log"
      - name: Audit installed dependencies including development dependencies
        id: audit
        run: npm audit --audit-level=low --prefix ruv-swarm/npm 2>&1 | tee "$RUNNER_TEMP/sqlite-security-node/audit.log"
      - name: Require actual patched SQLite and executed security tests
        id: evidence
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'sqlite-security-node');
          const root = path.resolve('ruv-swarm/npm');
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          const source = JSON.parse(readFileSync(path.join(root, 'scripts/sqlite-source.json')));
          const proof = JSON.parse(readFileSync(path.join(directory, 'runtime.json'))), receipt = proof.receipt;
          assert.equal(proof.schema, 'ruv-swarm.sqlite-verification/1'); assert.equal(proof.status, 'passed');
          assert.equal(source.version, '3.54.1'); assert.equal(proof.sqliteVersion, source.version); assert.equal(proof.sqliteSourceId, source.sourceId);
          assert.equal(receipt.schema, 'ruv-swarm.sqlite-build/1'); assert.equal(receipt.sqliteVersion, source.version); assert.equal(receipt.sqliteSourceId, source.sourceId);
          assert.equal(receipt.betterSqlite3Version, '12.11.1'); assert.equal(receipt.nodeGypVersion, '12.4.0');
          assert.equal(receipt.platform, process.platform); assert.equal(receipt.arch, process.arch); assert.equal(receipt.nodeAbi, process.versions.modules);
          const binary = path.join(root, 'native/sqlite', `${process.platform}-${process.arch}-abi${process.versions.modules}`, 'better_sqlite3.node');
          assert.equal(proof.nativeBinding, path.relative(root, binary));
          const bytes = readFileSync(binary); assert.equal(receipt.binaryBytes, bytes.length); assert.equal(receipt.binarySha256, sha(bytes));
          assert.equal(receipt.archiveSha256, source.archive.sha256);
          assert.deepEqual(Object.keys(receipt.sourceFiles).sort(), ['sqlite3.c', 'sqlite3.h', 'sqlite3ext.h']);
          for (const name of Object.keys(receipt.sourceFiles)) assert.equal(receipt.sourceFiles[name], source.files[name].sha256);
          const builders = ['sqlite-build.mjs', 'sqlite-build-source.mjs', 'sqlite-build-contract.mjs', 'sqlite-build-process.mjs', 'sqlite-source.json'];
          assert.deepEqual(Object.keys(receipt.builderFiles).sort(), builders.sort());
          for (const name of builders) assert.equal(receipt.builderFiles[name], sha(readFileSync(path.join(root, 'scripts', name))));
          for (const name of ['focused', 'security']) {
            const text = readFileSync(path.join(directory, name + '.log'), 'utf8');
            const count = key => Number(text.match(new RegExp('^# ' + key + ' (\\d+)$', 'm'))?.[1]);
            assert(count('tests') > 0 && count('pass') === count('tests') && count('fail') === 0 && count('skipped') === 0, 'missing actual security tests: ' + name);
          }
          const packed = JSON.parse(readFileSync(path.join(directory, 'package/receipt.json')));
          assert.equal(packed.schema, 'ruv-swarm.sqlite-package/1'); assert.equal(packed.status, 'passed');
          for (const key of ['actualLifecycleInstall', 'actualCliPersistence', 'unchanged']) assert.equal(packed[key], true);
          assert.equal(packed.sqliteVersion, source.version); assert.equal(packed.sourceId, source.sourceId); assert.equal(packed.nodeAbi, process.versions.modules);
          for (const key of ['binarySha256', 'tarballSha256']) assert.match(packed[key], /^[a-f0-9]{64}$/);
          assert.equal(packed.engine.schema, proof.schema); assert.equal(packed.engine.status, 'passed');
          assert.equal(packed.engine.sqliteVersion, source.version); assert.equal(packed.engine.sqliteSourceId, source.sourceId);
          assert.equal(packed.engine.receipt.binarySha256, packed.binarySha256);
          for (const key of ['schema', 'betterSqlite3Version', 'nodeGypVersion', 'platform', 'arch', 'nodeAbi', 'sqliteVersion', 'sqliteSourceId', 'archiveSha256']) assert.equal(packed.engine.receipt[key], receipt[key]);
          for (const key of ['sourceFiles', 'builderFiles']) assert.deepEqual(packed.engine.receipt[key], receipt[key], 'packed source identity changed: ' + key);
          console.log('Actual patched SQLite source/runtime, native binding identity and security regressions passed.');
          JS
      - name: Require an unchanged source checkout
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload Node evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-security-node-${{ matrix.node }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/sqlite-security-node/
