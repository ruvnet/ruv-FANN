name: ruv-FANN optional integrations

on:
  push:
    branches: [main, develop]
    paths:
      - 'integrations/ruv-fann/**'
      - 'ruv-swarm/npm/wasm/**'
      - 'ruv-swarm/npm/src/**'
      - 'ruv-swarm/npm/scripts/**'
      - 'ruv-swarm/crates/ruv-swarm-wasm/**'
      - 'ruv-swarm/Cargo.*'
      - 'src/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/ruv-fann-integrations.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'integrations/ruv-fann/**'
      - 'ruv-swarm/npm/wasm/**'
      - 'ruv-swarm/npm/src/**'
      - 'ruv-swarm/npm/scripts/**'
      - 'ruv-swarm/crates/ruv-swarm-wasm/**'
      - 'ruv-swarm/Cargo.*'
      - 'src/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/ruv-fann-integrations.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ruv-fann-integrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  integrations:
    name: FANN / RuVector / Darwin / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps
          --only-binary=:all: -r .github/tests/requirements-rune.txt
      - name: Check workflow failure propagation
        run: python3 -m unittest discover -s .github/tests -p 'test_integrations*.py' -v
      - name: Create external evidence directory
        run: mkdir -m 700 "$RUNNER_TEMP/ruv-fann-integrations"
      - name: Snapshot existing locks and production WASM before installation
        id: snapshot
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          import path from 'node:path';
          const names = ['Cargo.lock', 'ruv-swarm/Cargo.lock', 'neuro-divergent/Cargo.lock',
            'cuda-wasm/Cargo.lock', 'opencv-rust/Cargo.lock', 'config/rune-probe/Cargo.lock',
            'package-lock.json', 'ruv-swarm/npm/package-lock.json', 'cuda-wasm/package-lock.json',
            'ruv-swarm/npm/test-npm-install-v106/package-lock.json', 'tools/metaharness/package-lock.json',
            'integrations/ruv-fann/package.json', 'integrations/ruv-fann/package-lock.json',
            'ruv-swarm/npm/wasm/ruv_swarm_wasm_bg.wasm', 'ruv-swarm/npm/wasm/ruv_swarm_simd.wasm',
            'ruv-swarm/npm/wasm/ruv_swarm_wasm.js', 'ruv-swarm/npm/wasm/build-info.json'];
          const hashes = Object.fromEntries(names.map(name => [name, createHash('sha256').update(readFileSync(name)).digest('hex')]));
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'ruv-fann-integrations/inputs-before.json'), JSON.stringify(hashes, null, 2) + '\n', {flag:'wx'});
          JS
      - name: Install only the locked integration package
        id: install
        run: >-
          npm ci --ignore-scripts --omit=optional --prefix integrations/ruv-fann
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/install.log"
      - name: Audit installed dependencies including development dependencies
        id: audit
        run: >-
          npm audit --audit-level=low --omit=optional --prefix integrations/ruv-fann
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/audit.log"
      - name: Check public TypeScript declarations and consumer types
        id: types
        run: >-
          npm run build --prefix integrations/ruv-fann
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/types.log"
      - name: Test integration boundaries
        id: unit
        run: >-
          npm test --prefix integrations/ruv-fann
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/unit.log"
      - name: Test actual core and SIMD FANN, flat and HNSW RuVector, and Darwin
        id: e2e
        env:
          RUV_FANN_INTEGRATION_EVIDENCE: ${{ runner.temp }}/ruv-fann-source-evidence.json
        run: >-
          npm run test:e2e --prefix integrations/ruv-fann
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/e2e.log"
      - name: Pack and test an extracted consumer with actual WASM dependencies
        id: package
        run: >-
          node integrations/ruv-fann/scripts/check-package.mjs
          --output "$RUNNER_TEMP/ruv-fann-integration-package"
          2>&1 | tee "$RUNNER_TEMP/ruv-fann-integrations/package.log"
      - name: Require genuine source and package evidence without a speed requirement
        id: evidence
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync, writeFileSync} from 'node:fs';
          import path from 'node:path';
          const read = name => JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, name), 'utf8'));
          const hex = value => typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
          const positive = value => Number.isFinite(value) && value > 0;
          const integer = (value, low, high) => Number.isSafeInteger(value) && value >= low && value <= high;
          const tuning = receipt => {
            assert.equal(receipt.schema, 'ruv-fann.batch-tuning/1');
            assert.equal(receipt.status, 'passed');
            assert.equal(receipt.modelCalls, 0);
            assert.equal(receipt.sourceApplied, false);
            assert.equal(receipt.temporaryArchiveRemoved, true);
            assert.deepEqual(receipt.engine, {package:'@metaharness/darwin', version:'0.13.0', algorithm:'evolveNumeric'});
            assert.equal(receipt.limits.maxNumericBufferBytes, 64 * 1024 * 1024);
            assert(integer(receipt.limits.numericBufferBytes, 1, receipt.limits.maxNumericBufferBytes));
            assert(integer(receipt.limits.encoderStagingBytes, 1, receipt.limits.maxNumericBufferBytes));
            assert.equal(receipt.limits.cooperativeDeadline, true);
            const options = receipt.options, context = receipt.context, budget = receipt.trialBudget;
            assert(integer(options.baselineBatchRows, 1, 128));
            assert(integer(options.generations, 1, 3) && integer(options.children, 1, 2));
            assert(integer(options.samples, 5, 20));
            assert(integer(options.seed, 0, 4294967295));
            assert(integer(options.timeoutMs, 100, 120000));
            assert.equal(context.precision, 'f64');
            assert.equal(context.inputSize, 3); assert.equal(context.outputSize, 2);
            assert(integer(context.totalRows, 128, 1024));
            assert.equal(context.modelId, receipt.modelId);
            assert(typeof receipt.modelId === 'string' && receipt.modelId.length > 0);
            assert(typeof receipt.modelIdScope === 'string' && /label/i.test(receipt.modelIdScope));
            for (const key of ['inputSha256', 'outputSha256', 'workloadSha256']) assert(hex(context[key]));
            assert.equal(budget.absoluteLimit, 12);
            assert.equal(budget.concurrency, 1);
            assert.equal(budget.worstCaseDispatches, 1 + options.children + 2 * options.children * (options.generations - 1));
            assert(integer(budget.dispatchCount, 1, budget.worstCaseDispatches) && budget.worstCaseDispatches <= 12);
            assert(integer(budget.actualMeasurementCount, 1, budget.dispatchCount) && integer(budget.cacheHits, 0, budget.dispatchCount));
            assert.equal(budget.actualMeasurementCount + budget.cacheHits, budget.dispatchCount);
            assert(Array.isArray(receipt.trials) && receipt.trials.length === budget.dispatchCount);
            const observations = new Map(); let hits = 0;
            for (const trial of receipt.trials) {
              assert(integer(trial.genome.batchRows, 1, 128));
              assert.equal(trial.score.variantId, trial.variantId);
              assert(positive(trial.score.primary));
              assert.equal(typeof trial.score.regressed, 'boolean');
              const raw = trial.score.raw;
              assert.equal(raw.batchRows, trial.genome.batchRows);
              assert.equal(raw.maximumAbsoluteError, 0);
              for (const key of ['inputSha256', 'outputSha256', 'workloadSha256']) assert.equal(raw[key], context[key]);
              assert(Array.isArray(raw.samplesNs) && raw.samplesNs.length === options.samples && raw.samplesNs.every(positive));
              assert.equal(typeof raw.observationId, 'string');
              assert.equal(typeof raw.cacheHit, 'boolean');
              if (raw.cacheHit) { assert.equal(observations.get(raw.observationId), raw.batchRows); hits++; }
              else { assert(!observations.has(raw.observationId)); observations.set(raw.observationId, raw.batchRows); }
            }
            assert.equal(observations.size, budget.actualMeasurementCount); assert.equal(hits, budget.cacheHits);
            for (const measured of [receipt.baseline, receipt.winner]) {
              assert.equal(measured.score.regressed, false);
              assert(receipt.trials.some(trial => JSON.stringify(trial) === JSON.stringify(measured)), 'unmeasured baseline/winner');
            }
            assert.equal(receipt.baseline.genome.batchRows, options.baselineBatchRows);
            const confirmation = receipt.confirmation;
            assert.equal(confirmation.verified, true);
            assert.equal(confirmation.maximumAbsoluteError, 0);
            assert.equal(confirmation.workloadSha256, context.workloadSha256);
            assert.equal(confirmation.baselineBatchRows, options.baselineBatchRows);
            assert.equal(confirmation.candidateBatchRows, receipt.winner.genome.batchRows);
            assert.equal(confirmation.minimumImprovement, 0.05);
            for (const key of ['baselineSamplesNs', 'candidateSamplesNs']) assert(Array.isArray(confirmation[key]) && confirmation[key].length === options.samples && confirmation[key].every(positive));
            const sum = values => values.reduce((total, value) => total + value, 0);
            const ratio = sum(confirmation.baselineSamplesNs) / sum(confirmation.candidateSamplesNs);
            assert(positive(confirmation.meanSpeedRatio) && Math.abs(ratio - confirmation.meanSpeedRatio) <= 1e-10 * Math.max(1, ratio));
            assert(Array.isArray(confirmation.ci95) && confirmation.ci95.length === 2 && confirmation.ci95.every(positive) && confirmation.ci95[0] <= confirmation.ci95[1]);
            const faster = confirmation.candidateBatchRows !== confirmation.baselineBatchRows && confirmation.ci95[0] > 1.05;
            assert.equal(confirmation.faster, faster);
            assert.equal(confirmation.status, faster ? 'passed' : 'not_improved');
            assert.deepEqual(receipt.recommendation, faster ? receipt.winner.genome : receipt.baseline.genome);
          };
          const source = value => {
            assert.equal(value.schema, 'ruv-fann.integration-e2e/1');
            assert.equal(value.status, 'passed');
            assert.equal(value.sourceValidation, 'passed');
            assert.equal(value.modelCalls, 0);
            for (const name of ['actualNeuralInference', 'actualRuVector', 'actualDarwin', 'coreAndSimd', 'unchanged']) assert.equal(value[name], true, `missing actual proof: ${name}`);
            assert(value.inputsBefore && typeof value.inputsBefore === 'object' && !Array.isArray(value.inputsBefore));
            assert(Object.keys(value.inputsBefore).length >= 4, 'source hashes missing');
            for (const digest of Object.values(value.inputsBefore)) assert(hex(digest), 'invalid source digest');
            for (const name of ['ruv_swarm_wasm_bg.wasm', 'ruv_swarm_simd.wasm', 'ruv_swarm_wasm.js', 'build-info.json']) {
              const key = `ruv-swarm/npm/wasm/${name}`;
              assert.equal(value.inputsBefore[key], before[key], 'E2E did not use the snapshotted production artifact');
            }
            assert.deepEqual(value.inputsAfter, value.inputsBefore, 'source E2E inputs changed');
            assert(Array.isArray(value.cases) && value.cases.length === 8, 'all native fixtures and vector modes are required');
            const modes = new Set(), models = new Map(), binaries = new Map();
            for (const item of value.cases) {
              assert(['core', 'simd'].includes(item.variant));
              assert(['dense', 'sparse'].includes(item.fixture));
              assert(['flat', 'hnsw'].includes(item.indexType));
              const mode = `${item.variant}/${item.fixture}/${item.indexType}`;
              assert(!modes.has(mode), 'duplicate execution mode'); modes.add(mode);
              assert.equal(item.records, 33);
              assert.equal(item.outputMaximumAbsoluteError, 0);
              assert.equal(item.retrievalExpectedId, 'row-7');
              assert.equal(item.retrievalActualId, item.retrievalExpectedId);
              assert(Number.isFinite(item.queryDistance) && Math.abs(item.queryDistance) <= 1e-5, 'unexpected nearest distance');
              assert.deepEqual(item.dimensions, {input:3, output:2});
              assert(hex(item.modelJsonSha256) && hex(item.binarySha256), 'fixture/binary identity missing');
              const name = item.variant === 'core' ? 'ruv_swarm_wasm_bg.wasm' : 'ruv_swarm_simd.wasm';
              assert.equal(item.binarySha256, value.inputsBefore[`ruv-swarm/npm/wasm/${name}`]);
              if (models.has(item.fixture)) assert.equal(models.get(item.fixture), item.modelJsonSha256, 'model changed between runtimes');
              if (binaries.has(item.variant)) assert.equal(binaries.get(item.variant), item.binarySha256, 'binary changed between cases');
              models.set(item.fixture, item.modelJsonSha256); binaries.set(item.variant, item.binarySha256);
            }
            assert(Array.isArray(value.darwin) && value.darwin.length === 2, 'both actual Darwin runtimes are required');
            assert.deepEqual(value.darwin.map(item => item.variant).sort(), ['core', 'simd']);
            for (const item of value.darwin) tuning(item.receipt);
          };
          const before = read('ruv-fann-integrations/inputs-before.json');
          source(read('ruv-fann-source-evidence.json'));
          const packaged = read('ruv-fann-integration-package/receipt.json');
          assert.equal(packaged.schema, 'ruv-fann.integration-package/1');
          assert.equal(packaged.status, 'passed');
          assert(Number.isSafeInteger(packaged.actualConsumers) && packaged.actualConsumers >= 1);
          for (const name of ['actualNeuralInference', 'actualRuVector', 'actualDarwin', 'coreAndSimd']) assert.equal(packaged[name], true, `missing package proof: ${name}`);
          source(packaged.sourceEvidence);
          const oldLocks = ['Cargo.lock', 'ruv-swarm/Cargo.lock', 'neuro-divergent/Cargo.lock', 'cuda-wasm/Cargo.lock',
            'opencv-rust/Cargo.lock', 'config/rune-probe/Cargo.lock', 'package-lock.json', 'ruv-swarm/npm/package-lock.json',
            'cuda-wasm/package-lock.json', 'ruv-swarm/npm/test-npm-install-v106/package-lock.json', 'tools/metaharness/package-lock.json'];
          for (const name of oldLocks) assert(Object.hasOwn(before, name), `existing lock missing: ${name}`);
          const after = Object.fromEntries(Object.keys(before).map(name => [name, createHash('sha256').update(readFileSync(name)).digest('hex')]));
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'ruv-fann-integrations/inputs-after.json'), JSON.stringify(after, null, 2) + '\n', {flag:'wx'});
          assert.deepEqual(after, before, 'locks or production WASM changed');
          console.log('Actual source and packed FANN/RuVector/Darwin integration evidence passed; timing is observational.');
          JS
      - name: Require the source checkout to remain unchanged
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruv-fann-integrations-node-${{ matrix.node }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ruv-fann-integrations/
            ${{ runner.temp }}/ruv-fann-source-evidence.json
            ${{ runner.temp }}/ruv-fann-integration-package/*.json
