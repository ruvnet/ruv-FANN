name: WSP npm qualification

on:
  # Frozen WSP 0.2.0 lane. Metadata patch releases use metadata-qualification.yml.
  # Dispatch against the corresponding historical source ref for a legacy release.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit SHA to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wsp-qualification-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Node 22/24, browser and exact packed archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Bind run to the exact requested source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install exact published runtime dependency without changing manifests
        run: npm install --prefix packages/wsp --ignore-scripts --no-save --package-lock=false --no-audit --no-fund ruv-fann@0.1.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
      - name: Install hash-pinned benchmark-only tree baseline
        run: |
          python -m venv "$RUNNER_TEMP/wsp-benchmark-python"
          "$RUNNER_TEMP/wsp-benchmark-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r packages/wsp/benchmarks/requirements.lock
      - name: Validate tokenless publication context and existing release evidence guards
        run: node --test scripts/constellation-oidc.test.mjs scripts/wsp-release-evidence.test.mjs
      - name: Run source tests and require zero skips or todos on Node 22
        run: node scripts/wsp-release-lane.mjs unit --output "$RUNNER_TEMP/wsp-receipts/node-22-unit.json"
      - name: Pack candidate exactly once
        run: |
          npm install --prefix "$RUNNER_TEMP/wsp-tools" --no-save --package-lock=false typescript@5.9.3
          node scripts/wsp-release-lane.mjs pack --output "$RUNNER_TEMP/wsp-candidate"
      - name: Install and test packed archive plus strict declarations on Node 22
        env:
          TSC: ${{ runner.temp }}/wsp-tools/node_modules/typescript/bin/tsc
        run: node scripts/wsp-release-lane.mjs consumer --candidate "$RUNNER_TEMP/wsp-candidate/package-manifest.json" --tsc "$TSC" --output "$RUNNER_TEMP/wsp-receipts/node-22-consumer.json"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.0.0'
          package-manager-cache: false
      - name: Run source tests and require zero skips or todos on Node 24
        run: node scripts/wsp-release-lane.mjs unit --output "$RUNNER_TEMP/wsp-receipts/node-24-unit.json"
      - name: Install and test the same packed archive plus strict declarations on Node 24
        env:
          TSC: ${{ runner.temp }}/wsp-tools/node_modules/typescript/bin/tsc
        run: node scripts/wsp-release-lane.mjs consumer --candidate "$RUNNER_TEMP/wsp-candidate/package-manifest.json" --tsc "$TSC" --output "$RUNNER_TEMP/wsp-receipts/node-24-consumer.json"
      - name: Evaluate the exact installed archive on provenance-pinned public datasets
        run: node scripts/wsp-release-lane.mjs benchmark --candidate "$RUNNER_TEMP/wsp-candidate/package-manifest.json" --python "$RUNNER_TEMP/wsp-benchmark-python/bin/python" --output "$RUNNER_TEMP/wsp-receipts/benchmark.json"
      - name: Require zero known production dependency advisories
        run: node scripts/wsp-release-lane.mjs audit --candidate "$RUNNER_TEMP/wsp-candidate/package-manifest.json" --output "$RUNNER_TEMP/wsp-receipts/security.json"
      - name: Install pinned browser qualification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wsp-tools" --no-save --package-lock=false playwright@1.56.1
          npx --yes --package playwright@1.56.1 playwright install --with-deps chromium
      - name: Exercise exact installed archive in real Chromium
        env:
          PLAYWRIGHT: ${{ runner.temp }}/wsp-tools/node_modules/playwright/index.mjs
        run: node scripts/wsp-release-lane.mjs browser --candidate "$RUNNER_TEMP/wsp-candidate/package-manifest.json" --playwright "$PLAYWRIGHT" --output "$RUNNER_TEMP/wsp-receipts/browser.json"
      - name: Seal exact tested source, archive and all non-skipped receipts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: |
          node scripts/wsp-release-lane.mjs seal --expected-sha "$EXPECTED_SHA" --release-tag ruv-fann-wsp-v0.2.0 --directory "$RUNNER_TEMP/wsp-candidate" --unit-receipts "$RUNNER_TEMP/wsp-receipts" --consumer-receipts "$RUNNER_TEMP/wsp-receipts" --browser-receipt "$RUNNER_TEMP/wsp-receipts/browser.json" --benchmark-receipt "$RUNNER_TEMP/wsp-receipts/benchmark.json" --security-receipt "$RUNNER_TEMP/wsp-receipts/security.json"
          cp "$RUNNER_TEMP/wsp-receipts/"*.json "$RUNNER_TEMP/wsp-candidate/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsp-candidate-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          path: ${{ runner.temp }}/wsp-candidate/
          if-no-files-found: error
          retention-days: 90
