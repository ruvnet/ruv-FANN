name: MetaHarness bounded WASM tuning

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/metaharness/**'
      - 'ruv-swarm/npm/wasm/**'
      - 'ruv-swarm/npm/src/**'
      - 'ruv-swarm/npm/examples/**'
      - 'ruv-swarm/npm/scripts/**'
      - 'ruv-swarm/crates/ruv-swarm-wasm/**'
      - 'ruv-swarm/Cargo.*'
      - 'src/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/metaharness.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tools/metaharness/**'
      - 'ruv-swarm/npm/wasm/**'
      - 'ruv-swarm/npm/src/**'
      - 'ruv-swarm/npm/examples/**'
      - 'ruv-swarm/npm/scripts/**'
      - 'ruv-swarm/crates/ruv-swarm-wasm/**'
      - 'ruv-swarm/Cargo.*'
      - 'src/**'
      - 'Cargo.*'
      - '.cargo/**'
      - '.github/workflows/metaharness.yml'
      - '.github/workflows/ci.yml'
      - '.github/tests/**'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: metaharness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  numeric:
    name: Real WASM / Darwin numeric / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser (explicit setup)
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --no-deps
          --only-binary=:all: -r .github/tests/requirements-rune.txt
      - name: Check workflow failure propagation
        run: python3 -m unittest discover -s .github/tests -p 'test_metaharness*.py' -v
      - name: Install only the private locked MetaHarness tool
        id: install
        run: npm ci --ignore-scripts --omit=optional --prefix tools/metaharness
      - name: Audit all installed tool dependencies, including development dependencies
        id: audit
        run: npm audit --audit-level=low --omit=optional --prefix tools/metaharness
      - name: Test adapter input and process boundaries with synthetic fixtures
        id: boundaries
        run: node --test tools/metaharness/test/*.test.mjs
      - name: Run bounded Darwin tuning on the actual core WASM
        id: core
        run: >-
          node tools/metaharness/src/cli.mjs optimize --repo . --variant core --model tiny
          --generations 1 --children 1 --seed 7 --samples 5 --total-rows 128
          --timeout-ms 60000 --output "$RUNNER_TEMP/metaharness-core"
      - name: Run bounded Darwin tuning on the actual SIMD WASM
        id: simd
        run: >-
          node tools/metaharness/src/cli.mjs optimize --repo . --variant simd --model tiny
          --generations 1 --children 1 --seed 7 --samples 5 --total-rows 128
          --timeout-ms 60000 --output "$RUNNER_TEMP/metaharness-simd"
      - name: Require bounded correctness and confirmation evidence, without requiring a speedup
        id: evidence
        # Timing is observational. Retaining the baseline after independent
        # confirmation is valid; shared-runner speed is never a release gate.
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import path from 'node:path';
          const finite = Number.isFinite;
          const positive = value => finite(value) && value > 0;
          const score = (value, context, genome, variantId) => {
            assert.equal(value?.variantId, variantId);
            assert(positive(value?.primary), 'invalid numeric throughput');
            assert(finite(value.noopRate) && finite(value.costPerWin), 'non-finite score');
            assert.equal(typeof value.regressed, 'boolean');
            const raw = value.raw;
            assert(raw?.maximumAbsoluteError === 0, 'WASM outputs diverged');
            assert(Array.isArray(raw.samplesNs) && raw.samplesNs.length === 5 && raw.samplesNs.every(positive), 'invalid trial measurements');
            assert(Number.isSafeInteger(raw.batchRows) && raw.batchRows >= 1 && raw.batchRows <= 128, 'invalid batchRows');
            assert.equal(raw.batchRows, genome.batchRows);
            assert.match(raw.outputSha256, /^[a-f0-9]{64}$/);
            for (const key of Object.keys(context)) assert.deepEqual(raw[key], context[key], `changed workload: ${key}`);
            assert.equal(typeof raw.cacheHit, 'boolean');
            assert.equal(typeof raw.observationId, 'string');
            assert(raw.observationId.length > 0);
          };
          for (const variant of ['core', 'simd']) {
            const receipt = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, `metaharness-${variant}`, 'receipt.json'), 'utf8'));
            assert.equal(receipt.schema, 'ruv-fann.metaharness/1');
            assert.equal(receipt.status, 'passed');
            assert.equal(receipt.modelCalls, 0);
            assert.equal(receipt.sourceApplied, false);
            assert.equal(receipt.pins?.metaharness?.version, '0.4.21');
            assert.equal(receipt.pins?.darwin?.version, '0.13.0');
            assert.equal(receipt.pins?.referenceCommit, 'b27878cf39d3ada6b2c4d1bcc3e9258a70c6cfd6');
            for (const supplier of ['metaharness', 'darwin']) assert.match(receipt.pins[supplier].npmIntegrity, /^sha512-[A-Za-z0-9+/=]+$/);
            const before = receipt.inputsBefore;
            assert(before && typeof before === 'object' && !Array.isArray(before));
            const paths = Object.keys(before);
            const legacyLocks = ['Cargo.lock', 'ruv-swarm/Cargo.lock', 'neuro-divergent/Cargo.lock', 'cuda-wasm/Cargo.lock', 'opencv-rust/Cargo.lock', 'config/rune-probe/Cargo.lock', 'package-lock.json', 'ruv-swarm/npm/package-lock.json', 'cuda-wasm/package-lock.json', 'ruv-swarm/npm/test-npm-install-v106/package-lock.json'];
            for (const name of legacyLocks) assert(Object.hasOwn(before, `repo/${name}`), `legacy lock not captured: ${name}`);
            for (const name of ['tool/package.json', 'tool/package-lock.json']) assert(Object.hasOwn(before, name), 'private tool manifest/lock not captured');
            for (const name of ['ruv_swarm_wasm_bg.wasm', 'ruv_swarm_simd.wasm', 'ruv_swarm_wasm.js']) assert(paths.some(key => key.endsWith(name)), 'production WASM/bindings not captured');
            for (const digest of Object.values(before)) assert.match(digest, /^[a-f0-9]{64}$/);
            assert.deepEqual(receipt.inputsAfter, before, 'source, locks, suppliers or WASM changed');
            const context = receipt.evaluatorContext;
            assert.equal(context?.variant, variant);
            assert.equal(context.model, 'tiny');
            assert.equal(context.totalRows, 128);
            assert.equal(context.activation, 'Linear');
            assert.equal(context.precision, 'f64');
            assert.deepEqual(context.layers, [5, 7, 3]);
            for (const key of ['inputSha256', 'weightsSha256', 'outputSha256', 'sourceSha256', 'binarySha256', 'glueSha256', 'receiptSha256', 'workloadSha256']) assert.match(context[key], /^[a-f0-9]{64}$/);
            const binaryName = variant === 'core' ? 'ruv_swarm_wasm_bg.wasm' : 'ruv_swarm_simd.wasm';
            assert.equal(context.binarySha256, before[`repo/ruv-swarm/npm/wasm/${binaryName}`]);
            assert.equal(context.glueSha256, before['repo/ruv-swarm/npm/wasm/ruv_swarm_wasm.js']);
            assert.equal(context.receiptSha256, before['repo/ruv-swarm/npm/wasm/build-info.json']);
            const budget = receipt.trialBudget;
            for (const key of ['absoluteLimit', 'worstCaseDispatches', 'dispatchCount', 'actualMeasurementCount', 'cacheHits']) assert(Number.isSafeInteger(budget?.[key]) && budget[key] >= 0, 'invalid trial accounting');
            assert.equal(budget.absoluteLimit, 12);
            assert.equal(budget.concurrency, 1);
            assert(budget.dispatchCount >= 1 && budget.actualMeasurementCount >= 1);
            assert(budget.dispatchCount <= budget.worstCaseDispatches && budget.worstCaseDispatches <= 12);
            assert.equal(budget.actualMeasurementCount + budget.cacheHits, budget.dispatchCount);
            assert.equal(receipt.trials.length, budget.dispatchCount);
            const observations = new Map();
            let cacheHits = 0;
            for (const trial of receipt.trials) {
              assert(Number.isSafeInteger(trial.genome?.batchRows) && trial.genome.batchRows >= 1 && trial.genome.batchRows <= 128);
              score(trial.score, context, trial.genome, trial.variantId);
              const raw = trial.score.raw;
              if (raw.cacheHit) {
                assert.equal(observations.get(raw.observationId), trial.genome.batchRows);
                cacheHits++;
              } else {
                assert(!observations.has(raw.observationId), 'reused observation identity');
                observations.set(raw.observationId, trial.genome.batchRows);
              }
            }
            assert.equal(observations.size, budget.actualMeasurementCount);
            assert.equal(cacheHits, budget.cacheHits);
            for (const item of [receipt.baseline, receipt.winner]) {
              score(item.score, context, item.genome, item.variantId);
              assert.equal(item.score.regressed, false);
              assert(receipt.trials.some(trial => trial.variantId === item.variantId && JSON.stringify(trial.genome) === JSON.stringify(item.genome) && JSON.stringify(trial.score) === JSON.stringify(item.score)), 'unmeasured baseline/winner');
            }
            const baselineBatchRows = receipt.options?.baselineBatchRows;
            assert(Number.isSafeInteger(baselineBatchRows) && baselineBatchRows >= 1 && baselineBatchRows <= 128, 'invalid configured baseline');
            assert.equal(receipt.baseline.genome.batchRows, baselineBatchRows, 'measured baseline differs from requested baseline');
            const confirmation = receipt.confirmation;
            assert.equal(confirmation?.verified, true);
            assert(['passed', 'not_improved'].includes(confirmation.status));
            assert.equal(typeof confirmation.faster, 'boolean');
            assert(positive(confirmation.meanSpeedRatio));
            assert(Array.isArray(confirmation.ci95) && confirmation.ci95.length === 2 && confirmation.ci95.every(finite) && confirmation.ci95[0] <= confirmation.ci95[1]);
            assert.equal(confirmation.maximumAbsoluteError, 0);
            assert.equal(confirmation.workloadSha256, context.workloadSha256);
            assert.equal(confirmation.baselineBatchRows, receipt.baseline.genome.batchRows);
            assert.equal(confirmation.candidateBatchRows, receipt.winner.genome.batchRows);
            for (const key of ['baselineSamplesNs', 'candidateSamplesNs']) assert(Array.isArray(confirmation[key]) && confirmation[key].length === 5 && confirmation[key].every(positive), 'fresh paired confirmation samples missing');
            const mean = values => values.reduce((sum, value) => sum + value, 0) / values.length;
            const observedRatio = mean(confirmation.baselineSamplesNs) / mean(confirmation.candidateSamplesNs);
            assert(positive(observedRatio) && Math.abs(observedRatio - confirmation.meanSpeedRatio) <= 1e-12 * Math.max(1, observedRatio), 'reported confirmation ratio disagrees with samples');
            assert.equal(confirmation.minimumImprovement, 0.05);
            const faster = confirmation.candidateBatchRows !== confirmation.baselineBatchRows && confirmation.ci95[0] > 1.05;
            assert.equal(confirmation.faster, faster);
            assert.equal(confirmation.status, faster ? 'passed' : 'not_improved');
            assert.deepEqual(receipt.recommendation, faster ? receipt.winner.genome : receipt.baseline.genome);
            console.log(`${variant}: bounded genuine numeric evolution and independent confirmation passed; timing is observational`);
          }
          JS
      - name: Require the source checkout to remain unchanged
        id: unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload bounded experiment evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metaharness-node-${{ matrix.node }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/metaharness-core/*.json
            ${{ runner.temp }}/metaharness-core/**/*.log
            ${{ runner.temp }}/metaharness-simd/*.json
            ${{ runner.temp }}/metaharness-simd/**/*.log
