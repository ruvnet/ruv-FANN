name: protected-release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact qualified main commit to publish
        required: true
        type: string

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: protected-wsp-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require exact current main and reviewed SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api repos/${GITHUB_REPOSITORY}/commits/main --jq .sha)" = "$EXPECTED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=release-blocker&state=open&per_page=1" --jq length)" = 0
      - name: Pin npm CLI with trusted publishing support
        run: |
          npm install --prefix "$RUNNER_TEMP/wsp-npm-cli" --ignore-scripts --no-audit --no-fund npm@11.9.0
          echo "$RUNNER_TEMP/wsp-npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download and verify only the exact successful qualification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wsp-candidate-download.mjs --expected-sha "${{ inputs.expected_sha }}" --output "$RUNNER_TEMP/wsp-candidate"
      - name: Publish exact archive using npm OIDC and provenance or verify identical existing version
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node scripts/wsp-release-lane.mjs publish --seal "$RUNNER_TEMP/wsp-candidate/candidate-seal.json" --output "$RUNNER_TEMP/wsp-publication.json"
      - name: Verify fresh-cache public install and full real-WASM consumer
        env:
          GH_TOKEN: ''
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node scripts/wsp-release-lane.mjs public-consumer --seal "$RUNNER_TEMP/wsp-candidate/candidate-seal.json" --publication "$RUNNER_TEMP/wsp-publication.json" --output "$RUNNER_TEMP/wsp-public-consumer.json"
      - name: Create or verify the source-bound GitHub release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wsp-release-lane.mjs github-release --seal "$RUNNER_TEMP/wsp-candidate/candidate-seal.json" --publication "$RUNNER_TEMP/wsp-publication.json" --public-consumer "$RUNNER_TEMP/wsp-public-consumer.json" --release-receipt "$RUNNER_TEMP/wsp-release-receipt.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsp-public-release-${{ inputs.expected_sha }}
          path: |
            ${{ runner.temp }}/wsp-candidate/*.tgz
            ${{ runner.temp }}/wsp-candidate/candidate-seal.json
            ${{ runner.temp }}/wsp-candidate/benchmark.json
            ${{ runner.temp }}/wsp-candidate/security.json
            ${{ runner.temp }}/wsp-publication.json
            ${{ runner.temp }}/wsp-public-consumer.json
            ${{ runner.temp }}/wsp-release-receipt.json
          if-no-files-found: error
          retention-days: 90
