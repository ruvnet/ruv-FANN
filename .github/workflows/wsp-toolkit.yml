name: WSP toolkit qualification

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact reviewed source requested by the caller
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'packages/wsp-toolkit/**'
      - 'packages/core/**'
      - 'scripts/toolkit-*.mjs'
      - 'scripts/constellation-oidc*.mjs'
      - 'scripts/wsp-release-lane.mjs'
      - '.github/workflows/protected-wsp-release.yml'
      - '.github/workflows/protected-toolkit-release.yml'
      - '.github/workflows/constellation-observatory.yml'
      - '.github/workflows/wsp-toolkit.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/npm-modules.yml'
      - '.github/workflows/protected-npm-modules.yml'
      - 'scripts/npm-release-*.mjs'
      - 'scripts/npm-modules-*.mjs'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: toolkit-qualification-${{ github.workflow }}-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Node 22/24 and Chromium, thirteen sealed archives
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Require exact requested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          CALLER_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if test -n "$CALLER_SHA"; then test "$CALLER_SHA" = "$EXPECTED_SHA"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install locked tooling and real AgentDB integration without lifecycle scripts
        run: |
          npm ci --prefix packages/wsp-toolkit --ignore-scripts --no-audit --no-fund
          npm run --prefix packages/wsp-toolkit setup:agentdb
          packages/wsp-toolkit/node_modules/.bin/playwright install --with-deps chromium
      - name: Require release guard mutation tests
        run: node --test scripts/toolkit-release.test.mjs
      - name: Pack all thirteen archives exactly once from clean source
        run: node scripts/toolkit-release-lane.mjs pack --directory "$RUNNER_TEMP/toolkit-candidate"
      - name: Qualify canonical archives, strict types, browser, integration, work benchmark and audits on Node 22
        run: node scripts/toolkit-release-lane.mjs qualify --directory "$RUNNER_TEMP/toolkit-candidate"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Qualify the same archives and Node 22 dependency resolution on Node 24
        run: node scripts/toolkit-release-lane.mjs qualify --directory "$RUNNER_TEMP/toolkit-candidate"
      - name: Seal source, dependency graph, package SRI and both non-skipped qualifications
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
        run: |
          node scripts/toolkit-release-lane.mjs seal --expected-sha "$EXPECTED_SHA" --directory "$RUNNER_TEMP/toolkit-candidate"
          node scripts/toolkit-release-lane.mjs verify --directory "$RUNNER_TEMP/toolkit-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-candidate-${{ github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}
          path: ${{ runner.temp }}/toolkit-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
