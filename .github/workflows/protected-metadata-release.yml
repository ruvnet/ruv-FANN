name: protected-metadata-release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact qualified current main commit to publish
        required: true
        type: string

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: protected-metadata-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require exact current main and zero release blockers; download verified qualification artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/metadata-release.mjs download --expected-sha "$EXPECTED_SHA" --output "$RUNNER_TEMP/metadata-candidate"
      - name: Publish only sealed metadata archives with npm provenance
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/metadata-release.mjs publish --directory "$RUNNER_TEMP/metadata-candidate" --output "$RUNNER_TEMP/metadata-publication"
      - name: Install locked public-consumer tooling without release credentials
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node scripts/metadata-release.mjs bootstrap
      - name: Verify canonical public bytes and a fresh-cache npm ci installed consumer
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node scripts/metadata-release.mjs public-consumer --directory "$RUNNER_TEMP/metadata-candidate" --publication "$RUNNER_TEMP/metadata-publication/publication.json" --output "$RUNNER_TEMP/metadata-public-consumer.json"
      - name: Create exact-source GitHub release and download-verify every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/metadata-release.mjs github-release --directory "$RUNNER_TEMP/metadata-candidate" --publication "$RUNNER_TEMP/metadata-publication/publication.json" --public-consumer "$RUNNER_TEMP/metadata-public-consumer.json" --output "$RUNNER_TEMP/metadata-release-receipt.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metadata-publication-${{ inputs.expected_sha }}
          path: |
            ${{ runner.temp }}/metadata-candidate/
            ${{ runner.temp }}/metadata-publication/
            ${{ runner.temp }}/metadata-public-consumer.json
            ${{ runner.temp }}/metadata-release-receipt.json
          if-no-files-found: error
          retention-days: 90
