name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # Current npm generation: core 0.2.0 plus twelve exact toolkit satellites.
  # The former npm-modules.yml pair lane is manual/reusable for 0.1.2 refs only.
  npm-toolkit:
    uses: ./.github/workflows/wsp-toolkit.yml
    with:
      expected_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  wasm-targets:
    uses: ./.github/workflows/wasm-build.yml

  rune:
    uses: ./.github/workflows/rune.yml

  metaharness:
    uses: ./.github/workflows/metaharness.yml

  ruv-fann-integrations:
    uses: ./.github/workflows/ruv-fann-integrations.yml

  candle-native:
    uses: ./.github/workflows/candle-native.yml

  sqlite-security:
    uses: ./.github/workflows/sqlite-security.yml

  inventory-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-packages.py --inventory > package-inventory.json
      - run: python3 scripts/verify-packages.py --docs
      - run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-inventory
          path: package-inventory.json
          if-no-files-found: error

  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --locked --lib --tests
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --lib
      - run: cargo package --locked --allow-dirty

  core-features:
    name: Core features / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ['', 'simd', 'io', 'parallel']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Test minimal feature combinations
        env:
          TEST_FEATURES: ${{ matrix.features }}
        run: cargo test --locked --lib --no-default-features --features "$TEST_FEATURES"
      - name: Test all core features without probing GPU hardware
        if: matrix.features == ''
        env:
          RUV_FANN_CI_TESTING: '1'
        run: cargo test --locked --all-features --lib
      - name: Check every core target and the minimal native GPU feature graph
        if: matrix.features == ''
        run: |
          cargo check --locked --all-targets --all-features
          cargo check --locked --lib --no-default-features --features gpu

  msrv:
    name: Core library MSRV 1.81
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.81.0
      # This is the library's MSRV. Current dev tools may need newer Rust.
      - run: cargo check --locked --lib

  workspaces:
    name: Portable libraries / ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {workspace: 'ruv-swarm', toolchain: '1.89.0'}
          - {workspace: 'neuro-divergent', toolchain: 'stable'}
          - {workspace: 'cuda-wasm', toolchain: 'stable'}
          - {workspace: 'opencv-rust', toolchain: 'stable'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install real native OpenCV build prerequisites
        if: matrix.workspace == 'opencv-rust'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopencv-dev libclang-dev
      - name: Check and test all workspace targets
        env:
          TEST_WORKSPACE: ${{ matrix.workspace }}
        run: |
          python3 scripts/verify-packages.py --check --workspace "$TEST_WORKSPACE"
          python3 scripts/verify-packages.py --test --workspace "$TEST_WORKSPACE"

  rust-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: python3 scripts/verify-packages.py --audit

  npm:
    name: npm / Node ${{ matrix.node }} / ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {node: '22.13.0', directory: 'ruv-swarm/npm'}
          - {node: '24', directory: 'ruv-swarm/npm'}
          - {node: '22.12.0', directory: 'cuda-wasm'}
          - {node: '24', directory: 'cuda-wasm'}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: npm ci
      - run: npm test
      - name: Run the swarm integration runner
        if: matrix.directory == 'ruv-swarm/npm'
        run: npm run test:all
      - name: Build the real CUDA source translator
        if: matrix.directory == 'cuda-wasm'
        run: cargo build --locked --bin cuda2rust
      - name: Exercise CUDA Node bindings against the actual translator
        if: matrix.directory == 'cuda-wasm'
        env:
          CUDA2RUST_BINARY: ${{ github.workspace }}/cuda-wasm/target/debug/cuda2rust
        run: npm run test:integration
      - run: npm audit --audit-level=low
      - run: npm pack --dry-run

  compute-and-browser:
    name: Real software Vulkan and browser compute
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
      - name: Execute public GPU operations against a real Vulkan adapter
        env:
          WGPU_BACKEND: vulkan
          RUV_FANN_ALLOW_SOFTWARE_GPU: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-webgpu"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cargo test --locked --features gpu --test webgpu_release_gate -- --test-threads=1
      - name: Install explicit browser and WASM build tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
          cargo install wasm-pack --version 0.15.1 --locked
      - name: Run repository shaders in a real browser
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          node scripts/verify-webgpu.cjs
          node scripts/verify-demo-dom.cjs
      - name: Build and exercise the real OpenCV browser bindings
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          wasm-pack build opencv-rust/opencv-wasm --target web --out-name opencv_wasm --out-dir "$RUNNER_TEMP/opencv-browser" -- --locked
          node opencv-rust/tests/browser-smoke.cjs "$RUNNER_TEMP/opencv-browser"
      - name: Build and execute real browser IndexedDB operations
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo build --manifest-path ruv-swarm/Cargo.toml --locked -p ruv-swarm-persistence --example indexeddb_browser_smoke --no-default-features --features wasm --target wasm32-unknown-unknown
          wasm-bindgen ruv-swarm/target/wasm32-unknown-unknown/debug/examples/indexeddb_browser_smoke.wasm --target web --out-dir "$RUNNER_TEMP/persistence-browser" --out-name persistence_smoke
          node ruv-swarm/crates/ruv-swarm-persistence/tests/browser-smoke.cjs "$RUNNER_TEMP/persistence-browser"
      - name: Build and exercise the real Rust WASM GPU bridge
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: node scripts/verify-rust-browser-gpu.cjs --build "$RUNNER_TEMP/fann-browser"
      - name: Verify batched SIMD arithmetic and browser equivalence
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          RUSTFLAGS='-C target-feature=+simd128' cargo build --manifest-path ruv-swarm/Cargo.toml -p ruv-swarm-wasm --locked --release --target wasm32-unknown-unknown --example verify_batch_wasm
          wasm-bindgen ruv-swarm/target/wasm32-unknown-unknown/release/examples/verify_batch_wasm.wasm --target web --out-dir "$RUNNER_TEMP/batch-probe" --out-name batch_probe
          BATCH_SIMD_PROBE_DIR="$RUNNER_TEMP/batch-probe" node scripts/verify-sota-wasm-browser.cjs
          curl -fsSL https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz -o "$RUNNER_TEMP/wabt.tar.gz"
          echo '84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131  '"$RUNNER_TEMP/wabt.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wabt.tar.gz" -C "$RUNNER_TEMP"
          python3 scripts/inspect-batch-simd.py ruv-swarm/npm/wasm/ruv_swarm_wasm_bg.wasm --wasm2wat "$RUNNER_TEMP/wabt-1.0.42/bin/wasm2wat" --expected scalar
          python3 scripts/inspect-batch-simd.py ruv-swarm/npm/wasm/ruv_swarm_simd.wasm --wasm2wat "$RUNNER_TEMP/wabt-1.0.42/bin/wasm2wat" --expected simd
          python3 scripts/inspect-batch-simd.py "$RUNNER_TEMP/batch-probe/batch_probe_bg.wasm" --wasm2wat "$RUNNER_TEMP/wabt-1.0.42/bin/wasm2wat" --export verify_prepared_batches --precision both --expected simd

  release-archives:
    name: Verify every Cargo release archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install native archive build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libopencv-dev libclang-dev
      - name: Build and verify ordered candidates in an isolated snapshot
        run: python3 scripts/verify-release.py --output "$RUNNER_TEMP/cargo-releases"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-cargo-release-archives
          path: |
            ${{ runner.temp }}/cargo-releases/archives/*.crate
            ${{ runner.temp }}/cargo-releases/receipt.json
            ${{ runner.temp }}/cargo-releases/receipt.sha256
            ${{ runner.temp }}/cargo-releases/publication-order.json
            ${{ runner.temp }}/cargo-releases/snapshot-files.json
          if-no-files-found: error
