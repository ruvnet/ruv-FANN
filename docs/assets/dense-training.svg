<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Train, inspect gradients, then freeze a model for deployment</title>
  <desc id="desc">Inputs and targets produce mean squared error. Reverse-mode differentiation computes gradients. SGD or AdamW updates weights. An independent frozen snapshot runs in Rust, browser WebAssembly or native Node and can feed RuVector search or MetaHarness tuning.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#101729"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#76e0d0"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    .move{stroke-dasharray:6 8;animation:flow 3s linear infinite}
    .reverse{animation-direction:reverse;stroke:#bbacff}
    @keyframes flow{to{stroke-dashoffset:-84}}
    @media(prefers-reduced-motion:reduce){.move{animation:none}}
  </style>
  <rect width="1040" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="358" rx="19" fill="none" stroke="#30405b"/>
  <text x="32" y="39" fill="#76e0d0" font-size="12" font-weight="700" letter-spacing="2">RUV-FANN / DENSE TRAINING</text>
  <text x="32" y="75" fill="#f0f5ff" font-size="25" font-weight="650">Learn weights. Check gradients. Freeze once.</text>
  <g fill="#17263e" stroke="#405674">
    <rect x="32" y="119" width="166" height="93" rx="12"/>
    <rect x="256" y="119" width="194" height="93" rx="12"/>
    <rect x="508" y="119" width="194" height="93" rx="12"/>
    <rect x="760" y="119" width="248" height="93" rx="12"/>
  </g>
  <g fill="#f0f5ff" font-size="16" font-weight="600" text-anchor="middle">
    <text x="115" y="151">Inputs + targets</text><text x="353" y="151">Forward + MSE</text>
    <text x="605" y="151">Gradients + step</text><text x="884" y="151">Frozen inference</text>
  </g>
  <g fill="#b2c1d8" font-size="13" text-anchor="middle">
    <text x="115" y="181">Your training rows</text><text x="353" y="181">Reusable activation tape</text>
    <text x="605" y="181">Explicit SGD or AdamW</text><text x="884" y="181">Rust · WASM · native Node</text>
  </g>
  <g class="move" fill="none" stroke="#76e0d0" stroke-width="2" marker-end="url(#arrow)">
    <path d="M201 165H248"/><path d="M454 165H500"/><path d="M706 165H752"/>
  </g>
  <path class="move reverse" d="M605 216v31H353v-31" fill="none" stroke-width="2"/>
  <text x="479" y="274" fill="#bbacff" font-size="13" text-anchor="middle">Reverse pass computes actual parameter and input gradients</text>
  <path d="M32 300H1008" stroke="#30405b"/>
  <text x="32" y="330" fill="#b2c1d8" font-size="13">Deploy the frozen model through the existing RuVector and MetaHarness integration. Each stage has explicit resource limits.</text>
</svg>
