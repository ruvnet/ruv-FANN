<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Prepared inference and past-only forecast calibration have separate lifecycles</title>
  <desc id="desc">The upper lane validates and copies a mutable network into an immutable snapshot. Each worker supplies its own reusable workspace and receives checked outputs. The lower lane uses observed chronological forecast errors only through an explicit as-of time, groups them by series, model and horizon, then applies calibrated widths to forecasts from later origins. Rebuild a snapshot after weight changes and recalibrate after model or data changes. Animation is decorative.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111e35"/><stop offset="1" stop-color="#15172c"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#91abc7" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .flow { stroke-dasharray: 7 11; animation: travel 12s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -144; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="1040" height="620" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="618" rx="19" fill="none" stroke="#30415b"/>
  <text x="36" y="43" fill="#79e2d0" font-size="12" font-weight="700" letter-spacing="2">RUV-FANN / TWO EXPLICIT ARTIFACTS</text>
  <text x="36" y="80" fill="#f2f6ff" font-size="29" font-weight="650">Reuse work. Keep the boundaries visible.</text>
  <text x="36" y="108" fill="#bacbe1" font-size="15">Prepared inference changes execution. Calibration adds intervals to point forecasts.</text>
  <text x="36" y="151" fill="#79e2d0" font-size="14" font-weight="700">1 / INFERENCE SNAPSHOT</text>
  <g fill="#192a40" stroke="#47617d">
    <rect x="36" y="170" width="212" height="108" rx="12"/>
    <rect x="286" y="170" width="212" height="108" rx="12"/>
    <rect x="536" y="170" width="212" height="108" rx="12"/>
    <rect x="786" y="170" width="218" height="108" rx="12"/>
  </g>
  <g fill="#f2f6ff" font-size="17" font-weight="650">
    <text x="54" y="203">Mutable network</text><text x="304" y="203">Owned snapshot</text>
    <text x="554" y="203">Worker workspace</text><text x="804" y="203">Checked output</text>
  </g>
  <g fill="#c3d2e5" font-size="14">
    <text x="54" y="231">Validate shape and limits</text><text x="54" y="253">Copy current parameters</text>
    <text x="304" y="231">Immutable packed values</text><text x="304" y="253">Original math and order</text>
    <text x="554" y="231">Reusable layer buffers</text><text x="554" y="253">One per concurrent caller</text>
    <text x="804" y="231">Commit only on success</text><text x="804" y="253">Rebuild after weight edits</text>
  </g>
  <g class="flow" fill="none" stroke="#79e2d0" stroke-width="2" marker-end="url(#arrow)">
    <path d="M248 224H279"/><path d="M498 224H529"/><path d="M748 224H779"/>
  </g>
  <path d="M36 310H1004" stroke="#30415b"/>
  <text x="36" y="347" fill="#c1aeff" font-size="14" font-weight="700">2 / CALIBRATION SNAPSHOT</text>
  <g fill="#24243f" stroke="#625781">
    <rect x="36" y="366" width="212" height="126" rx="12"/>
    <rect x="286" y="366" width="212" height="126" rx="12"/>
    <rect x="536" y="366" width="212" height="126" rx="12"/>
    <rect x="786" y="366" width="218" height="126" rx="12"/>
  </g>
  <g fill="#f2f6ff" font-size="17" font-weight="650">
    <text x="54" y="399">Observed CV errors</text><text x="304" y="399">Explicit as-of time</text>
    <text x="554" y="399">Group thresholds</text><text x="804" y="399">Future intervals</text>
  </g>
  <g fill="#d1cbe7" font-size="14">
    <text x="54" y="427">Targets follow each cutoff</text><text x="54" y="450">Absolute forecast errors</text><text x="54" y="473">Complete horizon windows</text>
    <text x="304" y="427">Use only observed targets</text><text x="304" y="450">at or before this boundary</text><text x="304" y="473">Reject future labels</text>
    <text x="554" y="427">Series × model × horizon</text><text x="554" y="450">Finite-sample rank rule</text><text x="554" y="473">Reject too few scores</text>
    <text x="804" y="427">Origin at/after as-of time</text><text x="804" y="450">Point ± calibrated width</text><text x="804" y="473">Tag coverage and sample n</text>
  </g>
  <g class="flow" fill="none" stroke="#c1aeff" stroke-width="2" marker-end="url(#arrow)">
    <path d="M248 429H279"/><path d="M498 429H529"/><path d="M748 429H779"/>
  </g>
  <text x="36" y="537" fill="#f2f6ff" font-size="16" font-weight="600">Time ordering prevents leakage. It does not prove exchangeable errors.</text>
  <text x="36" y="565" fill="#bacbe1" font-size="14">Recalibrate after model or data changes; evaluate coverage and width on a later untouched block.</text>
  <text x="36" y="594" fill="#91abc7" font-size="13">No foundation-model weights, adaptive PID method, universal speedup or SOTA accuracy is implied.</text>
</svg>
