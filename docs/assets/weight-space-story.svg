<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="story-title story-desc">
  <title id="story-title">See the weights. Prove the change.</title>
  <desc id="story-desc">An illustrated ruv-fann field guide. A small neural network sends values along weighted connections. Three cards describe inspecting a model, editing a weight and proving the result with evaluation. Open the linked guide for the interactive story and a real WebAssembly demonstration. The brief decorative animation runs once and respects reduced motion; every step remains visible when motion is disabled.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#172c2b" opacity=".1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#2d7068" stroke-width="1.4"/>
    </marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;letter-spacing:-3px}
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:'Courier New',monospace}
      .ink{fill:#172c2b}.muted{fill:#49615b}.teal{fill:#2d7068}.orange{fill:#c55534}
      .link{fill:none;stroke:#77948a;stroke-width:2.5}
      .flow{fill:none;stroke:#2d7068;stroke-width:3.5;stroke-dasharray:9 14;animation:flow 3s linear 1}
      .selected{fill:none;stroke:#c55534;stroke-width:5}
      .signal{transform-box:fill-box;transform-origin:center;animation:signal 2.5s ease-in-out 1}
      .signal-2{animation-delay:.8s}.signal-3{animation-delay:1.6s}
      .weight{animation:weight 4s ease-in-out 1}
      @keyframes flow{to{stroke-dashoffset:-46}}
      @keyframes signal{0%,65%,100%{opacity:.28;transform:scale(.83)}35%{opacity:1;transform:scale(1)}}
      @keyframes weight{0%,100%{stroke-width:4}50%{stroke-width:7}}
      @media(prefers-reduced-motion:reduce){.flow,.signal,.weight{animation:none}.signal{opacity:.7}}
    </style>
  </defs>
  <rect width="1200" height="750" rx="24" fill="#f6f4ee"/>
  <rect x="682" y="40" width="478" height="377" rx="20" fill="url(#grid)"/>
  <path d="M56 73H1144" stroke="#172c2b" stroke-opacity=".25"/>
  <text x="58" y="49" class="mono ink" font-size="21" letter-spacing="2">ruv-fann / THE INTERACTIVE FIELD GUIDE</text>
  <text x="1143" y="49" text-anchor="end" class="mono muted" font-size="20">01 — 06</text>

  <text x="54" y="179" class="serif ink" font-size="88">See the weights.</text>
  <text x="54" y="274" class="serif ink" font-size="88">Prove the change.</text>
  <text x="59" y="333" class="sans muted" font-size="30">Small networks. Visible decisions.</text>
  <text x="59" y="375" class="sans muted" font-size="27">From a single number to a tested revision.</text>

  <g aria-hidden="true">
    <path class="link" d="M750 158 902 145M750 158 902 242M750 158 902 339M750 288 902 145M750 288 902 242M750 288 902 339M902 145 1092 242M902 242 1092 242M902 339 1092 242"/>
    <path class="flow" d="M750 158 902 145 1092 242"/>
    <path class="selected weight" d="M750 288 902 242"/>
    <path class="flow" d="M902 339 1092 242"/>
    <g fill="#f6f4ee" stroke="#2d7068" stroke-width="3">
      <circle cx="750" cy="158" r="19"/><circle cx="750" cy="288" r="19"/>
      <circle cx="902" cy="145" r="22"/><circle cx="902" cy="242" r="22"/><circle cx="902" cy="339" r="22"/>
      <circle cx="1092" cy="242" r="28"/>
    </g>
    <circle class="signal" cx="750" cy="158" r="9" fill="#2d7068"/>
    <circle class="signal signal-2" cx="902" cy="145" r="11" fill="#2d7068"/>
    <circle class="signal signal-3" cx="1092" cy="242" r="14" fill="#2d7068"/>
    <circle cx="902" cy="242" r="10" fill="#c55534"/>
    <path d="m817 290 12-29" stroke="#c55534" stroke-width="2"/>
    <rect x="777" y="288" width="110" height="38" rx="8" fill="#f6f4ee" stroke="#c55534"/>
    <text x="832" y="314" text-anchor="middle" class="mono orange" font-size="22">w: 0 → 1</text>
    <text x="750" y="387" text-anchor="middle" class="mono muted" font-size="19">INPUT</text>
    <text x="925" y="387" text-anchor="middle" class="mono muted" font-size="19">HIDDEN LAYER</text>
    <text x="1092" y="387" text-anchor="middle" class="mono muted" font-size="19">OUTPUT</text>
  </g>

  <g>
    <rect x="56" y="435" width="340" height="184" rx="14" fill="#e9eee6" stroke="#b9c8ba"/>
    <text x="79" y="475" class="mono teal" font-size="21">01 / UNDERSTAND</text>
    <text x="78" y="527" class="serif ink" font-size="49" letter-spacing="-1">Inspect</text>
    <text x="80" y="568" class="sans muted" font-size="25">Follow the prediction.</text>
    <path d="M80 590h152" stroke="#2d7068" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="430" y="435" width="340" height="184" rx="14" fill="#f3e7dc" stroke="#dfbca6"/>
    <text x="453" y="475" class="mono orange" font-size="21">02 / EXPERIMENT</text>
    <text x="452" y="527" class="serif ink" font-size="49" letter-spacing="-1">Edit</text>
    <text x="454" y="568" class="sans muted" font-size="25">Change a weight.</text>
    <path d="M454 590h152" stroke="#2d7068" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="804" y="435" width="340" height="184" rx="14" fill="#e9eee6" stroke="#b9c8ba"/>
    <text x="827" y="475" class="mono teal" font-size="21">03 / EVALUATE</text>
    <text x="826" y="527" class="serif ink" font-size="49" letter-spacing="-1">Prove</text>
    <text x="828" y="568" class="sans muted" font-size="25">Test before promotion.</text>
    <path d="m828 588 6 6 12-14" stroke="#2d7068" stroke-width="3" fill="none"/>
  </g>
  <path d="M56 652H1144" stroke="#172c2b" stroke-opacity=".25"/>
  <text x="59" y="704" class="sans ink" font-size="31">Open the illustrated story + live WASM experiment</text>
  <circle cx="1109" cy="694" r="25" fill="#172c2b"/>
  <path d="M1099 694h19m-8-8 8 8-8 8" stroke="#f6f4ee" stroke-width="2" fill="none"/>
</svg>
