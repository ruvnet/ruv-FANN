<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Bounded ruv-fann weight evolution: propose, independently validate, commit and roll back</title>
  <desc id="desc">Three fixed-operation Node workers receive development data and return proposals. A coordinator keeps holdout data and finite-domain invariants separate, then requests an AgentDB proposal and expected-revision compare-and-swap. An explicit rollback creates a new revision containing the old weights. Worker results never authorize promotion. This conceptual illustration stops animating after four seconds.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#172c2b" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#2d7068" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172c2b}.serif{font-family:Georgia,'Times New Roman',serif}.muted{fill:#52645f}.label{font-size:14px;font-weight:700;letter-spacing:1.6px}.body{font-size:20px}.small{font-size:16px}.card{fill:#fffdf8;stroke:#d7ded5}.line{fill:none;stroke:#2d7068;stroke-width:2;marker-end:url(#arrow)}.trace{fill:none;stroke:#b7482b;stroke-width:4;stroke-dasharray:12 80;animation:travel 3.8s ease-out 1 both}@keyframes travel{0%{stroke-dashoffset:240;opacity:0}15%,80%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;display:none}}
    </style>
  </defs>
  <rect width="1200" height="600" rx="22" fill="#f6f4ee"/>
  <rect width="1200" height="600" rx="22" fill="url(#grid)"/>
  <path d="M44 37h36" stroke="#b7482b" stroke-width="4"/>
  <text x="94" y="43" class="label">RUV-FANN · BOUNDED WEIGHT EVOLUTION</text>
  <text x="44" y="108" font-size="47" class="serif">Many proposals. One accountable change.</text>
  <text x="44" y="145" font-size="20" class="muted">Workers explore. Independent gates check. Your revision authority decides.</text>
  <g transform="translate(44 184)">
    <rect width="250" height="266" rx="15" class="card"/>
    <text x="20" y="33" class="label muted">01 / PROPOSE</text>
    <g stroke="#95ada1" stroke-width="2" fill="none"><path d="M49 110h36m23-35 57 35m-57 35 57-35"/><circle cx="49" cy="110" r="16" fill="#e4ede3"/><circle cx="100" cy="75" r="15" fill="#e4ede3"/><circle cx="100" cy="145" r="15" fill="#e4ede3"/><circle cx="181" cy="110" r="20" fill="#2d7068" stroke="#2d7068"/></g>
    <text x="181" y="116" text-anchor="middle" font-size="19" style="fill:#fffdf8">Δw</text>
    <text x="20" y="204" class="body">Fixed-operation workers</text>
    <text x="20" y="233" class="small muted">Development inputs only</text>
  </g>
  <path d="M304 309h25" class="line"/>
  <g transform="translate(331 184)">
    <rect width="250" height="266" rx="15" class="card"/>
    <text x="20" y="33" class="label muted">02 / CHECK</text>
    <rect x="24" y="66" width="202" height="40" rx="8" fill="#e4ede3"/><rect x="24" y="118" width="202" height="40" rx="8" fill="#e4ede3"/>
    <path d="m37 84 5 5 10-11m-15 58 5 5 10-11" fill="none" stroke="#2d7068" stroke-width="2.5"/>
    <text x="64" y="91" class="small">Held-out suites</text><text x="64" y="143" class="small">Finite-domain rules</text>
    <text x="20" y="204" class="body">Independent evaluation</text>
    <text x="20" y="233" class="small muted">Real WASM · explicit budgets</text>
  </g>
  <path d="M591 309h25" class="line"/>
  <g transform="translate(618 184)">
    <rect width="250" height="266" rx="15" fill="#172c2b"/>
    <text x="20" y="33" class="label" style="fill:#e0eae1">03 / COMMIT</text>
    <ellipse cx="125" cy="77" rx="56" ry="15" fill="#29413b" stroke="#8ba795"/>
    <path d="M69 77v65c0 20 112 20 112 0V77M69 110c0 20 112 20 112 0" fill="none" stroke="#8ba795" stroke-width="1.5"/>
    <text x="125" y="109" text-anchor="middle" font-size="21" style="fill:#fffdf8">r1 → r2</text>
    <text x="20" y="204" class="body" style="fill:#fffdf8">AgentDB revision CAS</text>
    <text x="20" y="233" class="small" style="fill:#c3d1c8">Stored proposal + expected r1</text>
  </g>
  <path d="M878 309h25" class="line"/>
  <g transform="translate(905 184)">
    <rect width="250" height="266" rx="15" class="card"/>
    <text x="20" y="33" class="label muted">04 / RECOVER</text>
    <path d="M85 90a42 42 0 1 1-2 57M85 90v28h28" fill="none" stroke="#b7482b" stroke-width="3"/>
    <text x="134" y="125" text-anchor="middle" font-size="29" class="serif">r3</text>
    <text x="20" y="204" class="body">Explicit rollback</text>
    <text x="20" y="233" class="small muted">Old weights · new revision</text>
  </g>
  <path d="M304 309h25m262 0h25m262 0h25" class="trace"/>
  <path d="M44 483h1111" stroke="#d7ded5"/>
  <circle cx="53" cy="518" r="5" fill="#b7482b"/>
  <text x="70" y="525" font-size="19">A worker result is a candidate. A passing check is evidence. Promotion is a separate action.</text>
  <text x="44" y="565" class="label muted">LOCAL COMPUTE · FINITE TESTED DOMAINS · CALLER-OWNED AUTHORITY</text>
  <text x="1154" y="565" text-anchor="end" class="label" style="fill:#2d7068">EXPLORE THE FIELD GUIDE ↗</text>
</svg>
