<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
  <title id="title">A feedforward network, one layer at a time</title>
  <desc id="desc">Input numbers travel through weighted connections and activation functions to become output numbers. A network stores neuron values between layers. The run method returns a new output vector; run_into writes to an output slice supplied by the caller.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d35"/>
      <stop offset="1" stop-color="#11172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#7285a3" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .flow { stroke-dasharray: 5 11; animation: travel 5s linear infinite; }
    .neuron { animation: glow 8s ease-in-out infinite; }
    .later { animation-delay: 2s; }
    @keyframes travel { to { stroke-dashoffset: -96; } }
    @keyframes glow { 0%, 100% { stroke-opacity: .65; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .neuron { animation: none; } }
  </style>
  <rect width="1040" height="400" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1038" height="398" rx="19" fill="none" stroke="#2a3a55"/>
  <text x="36" y="48" fill="#76e0d0" font-size="12" font-weight="700" letter-spacing="2">RUV-FANN / CORE</text>
  <text x="36" y="83" fill="#f0f5ff" font-size="27" font-weight="650">Small networks. Explicit inputs and outputs.</text>
  <text x="36" y="112" fill="#b2c1d8" font-size="14">Each layer combines the previous values, then applies an activation function.</text>

  <g stroke="#405674" stroke-width="1.5" fill="none">
    <path d="M154 183 340 166 M154 183 340 218 M154 183 340 270 M154 253 340 166 M154 253 340 218 M154 253 340 270"/>
    <path d="M374 166 548 194 M374 218 548 194 M374 270 548 194 M374 166 548 246 M374 218 548 246 M374 270 548 246"/>
  </g>
  <g class="flow" stroke="#76e0d0" stroke-width="2" fill="none" opacity=".9">
    <path d="M154 183 340 218 548 194"/>
    <path d="M154 253 340 270 548 246"/>
  </g>
  <g fill="#152b43" stroke="#76e0d0" stroke-width="2.5">
    <circle cx="137" cy="183" r="17"/>
    <circle cx="137" cy="253" r="17"/>
    <circle class="neuron" cx="357" cy="166" r="17"/>
    <circle class="neuron" cx="357" cy="218" r="17"/>
    <circle class="neuron" cx="357" cy="270" r="17"/>
    <circle class="neuron later" cx="565" cy="194" r="17"/>
    <circle class="neuron later" cx="565" cy="246" r="17"/>
  </g>
  <g fill="#e5f7ff" font-size="12" text-anchor="middle">
    <text x="137" y="187">x₁</text><text x="137" y="257">x₂</text>
    <text x="357" y="170">ƒ</text><text x="357" y="222">ƒ</text><text x="357" y="274">ƒ</text>
    <text x="565" y="198">ƒ</text><text x="565" y="250">ƒ</text>
  </g>
  <g fill="#cad5e7" font-size="13" text-anchor="middle">
    <text x="137" y="304">Input values</text>
    <text x="357" y="304">Hidden layer</text>
    <text x="565" y="304">Output layer</text>
  </g>
  <path d="M591 220H654" fill="none" stroke="#7285a3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="682" y="152" width="318" height="153" rx="12" fill="#17243a" stroke="#3b506f"/>
  <text x="704" y="181" fill="#f0f5ff" font-size="15" font-weight="600">Choose the output API</text>
  <text x="704" y="212" fill="#76e0d0" font-family="monospace" font-size="14">run(inputs)</text>
  <text x="704" y="233" fill="#bccae0" font-size="13">Returns a new vector.</text>
  <text x="704" y="263" fill="#bbacff" font-family="monospace" font-size="14">run_into(inputs, outputs)</text>
  <text x="704" y="284" fill="#bccae0" font-size="13">Reuses your output buffer.</text>
  <path d="M36 337H1004" stroke="#2a3a55"/>
  <text x="36" y="369" fill="#b2c1d8" font-size="13">Weights describe what the network learned. This diagram shows data flow, not a performance benchmark.</text>
</svg>
