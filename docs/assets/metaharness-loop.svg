<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 285" role="img" aria-labelledby="title desc">
  <title id="title">Measured MetaHarness batch optimization</title>
  <desc id="desc">Darwin proposes bounded batch sizes. Each candidate processes the same input rows through actual WASM and must preserve every output. A fresh paired measurement confirms or rejects the selected candidate. Results are recommendations; production source and settings stay under the user's control.</desc>
  <style>
    .bg{fill:#0b1220}.box{fill:#152238;stroke:#40516e;stroke-width:1.4}
    .h{font:600 23px system-ui,sans-serif;fill:#f0f6fc}.t{font:600 16px system-ui,sans-serif;fill:#f0f6fc}
    .b{font:13px system-ui,sans-serif;fill:#c2cee0}.v{font:14px ui-monospace,monospace;fill:#90dfcb}
    .flow{fill:none;stroke:#90dfcb;stroke-width:3;stroke-dasharray:6 6;animation:flow 2.5s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-48}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <rect class="bg" width="1040" height="285" rx="16"/>
  <text class="h" x="28" y="40">Search. Measure. Confirm.</text>
  <text class="b" x="28" y="65">Actual WASM outputs and fresh timing evidence decide the recommendation.</text>
  <rect class="box" x="28" y="93" width="215" height="126" rx="10"/>
  <text class="t" x="44" y="121">Bounded Darwin search</text>
  <text class="v" x="44" y="153">batchRows: 1…128</text>
  <text class="b" x="44" y="180">One evaluator at a time</text>
  <text class="b" x="44" y="202">Reuse duplicate observations</text>
  <path class="flow" d="M247 156H283"/>
  <rect class="box" x="287" y="93" width="215" height="126" rx="10"/>
  <text class="t" x="303" y="121">Run production WASM</text>
  <text class="b" x="303" y="153">Same model and input rows</text>
  <text class="b" x="303" y="180">Check every output and tail</text>
  <text class="b" x="303" y="202">Time public checks and copies</text>
  <path class="flow" d="M506 156H542"/>
  <rect class="box" x="546" y="93" width="215" height="126" rx="10"/>
  <text class="t" x="562" y="121">Fresh paired check</text>
  <text class="b" x="562" y="153">Separate from search samples</text>
  <text class="b" x="562" y="180">Retain uncertainty and hashes</text>
  <text class="b" x="562" y="202">Keep baseline when unproven</text>
  <path class="flow" d="M765 156H801"/>
  <rect class="box" x="805" y="93" width="207" height="126" rx="10"/>
  <text class="t" x="821" y="121">Reviewable result</text>
  <text class="v" x="821" y="153">receipt.json + archive</text>
  <text class="b" x="821" y="180">No source or setting auto-edit</text>
  <text class="b" x="821" y="202">CI verifies real execution</text>
  <text class="b" x="28" y="257">Pinned packages · bounded time and output · zero model calls · workload-specific measurements</text>
</svg>
